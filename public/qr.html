<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donate QR</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  #stage { display: flex; align-items: flex-end; gap: 24px; }
  .qr-card {
    background: #fff; padding: 16px; border-radius: var(--qr-radius, 20px); display: flex; flex-direction: column;
    align-items: center; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .qr-card svg { display: block; width: var(--qr-size, 220px); height: var(--qr-size, 220px); }
  .jar-card {
    min-width: 300px; max-width: 430px; padding: 20px 22px; border-radius: var(--goal-radius, 20px); color: #e9edf3;
    background: #101217; border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 18px 50px rgba(0,0,0,.45); backdrop-filter: blur(10px);
  }
  .jar-card h2 { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
  .bar { height: 10px; border-radius: 6px; background: var(--track, rgba(255,255,255,.14)); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 6px;
    background: var(--accent, #8b5cf6); box-shadow: 0 0 12px color-mix(in srgb, var(--accent, #8b5cf6) 55%, transparent);
    transition: width .4s ease; }
  .bottom { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .bottom .raised { font-size: 24px; font-weight: 800; letter-spacing: .01em; line-height: 1.1; }
  .bottom .raised small { font-size: 13px; font-weight: 600; opacity: .7; margin-left: 3px; }
  .bottom .goal { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted, rgba(233,237,243,.62)); }
  .bottom .goal b { font-size: 14px; letter-spacing: 0; text-transform: none; color: inherit; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="qr-card" id="qrCard"><div id="qr"></div></div>
    <div class="jar-card" id="jarCard">
      <h2 id="title">—</h2>
      <div class="bar"><i id="fill"></i></div>
      <div class="bottom">
        <span class="raised"><span id="raised">0</span><small id="cur"></small></span>
        <span class="goal">of <b id="goal">—</b></span>
      </div>
    </div>
  </div>
</div>
<script src="/qrcode.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(Number(n) || 0).toLocaleString('uk-UA');
  const qrCard = $('qrCard'), jarCard = $('jarCard');
  const idx = (() => {
    const m = location.pathname.match(/^\/qr(\d*)/);
    return m && m[1] ? Math.max(0, Number(m[1]) - 1) : 0;
  })();
  const demo = new URLSearchParams(location.search).has('demo');
  const demoJar = { code: 'demo', title: 'TEST JAR', balance: 500000, goal: 1000000, currency: '₴' };
  let cfg = {}, cfgLoaded = false, widget = null, lastUrl = '', qrAlign = 'bottom', qrSize = 100;

  function luminance(hex) {
    const h = hex.replace('#', '');
    const rgb = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255)
      .map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4));
    return .2126 * rgb[0] + .7152 * rgb[1] + .0722 * rgb[2];
  }

  function applyColor(color) {
    const c = /^#[0-9a-f]{6}$/i.test(color || '') ? color : '#101217';
    const light = luminance(c) > .58;
    jarCard.style.background = c;
    jarCard.style.color = light ? '#101217' : '#e9edf3';
    jarCard.style.borderColor = light ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.14)';
    jarCard.style.setProperty('--track', light ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.14)');
    jarCard.style.setProperty('--muted', light ? 'rgba(16,18,23,.62)' : 'rgba(233,237,243,.62)');
  }

  function renderQr(url) {
    if (!url || url === lastUrl) return;
    lastUrl = url;
    try {
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      $('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, alt: 'Donate' });
    } catch (e) { console.warn(e); }
  }

  function applyLayout() {
    const stage = $('stage');
    stage.style.alignItems = qrAlign === 'top' ? 'flex-start' : qrAlign === 'mid' ? 'center' : 'flex-end';
    qrSize = Math.max(0, Math.min(200, Number(qrSize) || 0));
    qrCard.style.setProperty('--qr-size', Math.round(220 * qrSize / 100) + 'px');
  }

  function setWidget(w) {
    widget = w;
    if (!w) { qrCard.style.display = 'none'; jarCard.style.display = 'none'; return; }
    const style = w.style || 'both';
    qrCard.style.display = (style === 'goal' || qrSize <= 0) ? 'none' : '';
    jarCard.style.display = style === 'qr' ? 'none' : '';
    const radius = Math.max(0, Math.min(64, Number(w.radius ?? 20)));
    qrCard.style.setProperty('--qr-radius', radius + 'px');
    jarCard.style.setProperty('--goal-radius', radius + 'px');
    jarCard.style.setProperty('--accent', /^#[0-9a-f]{6}$/i.test(w.accent || '') ? w.accent : '#8b5cf6');
    applyColor(w.color);
    renderQr(cfg.publicDonate || (cfg.links && cfg.links.donate) || '');
  }

  async function loadCfg() {
    try {
      cfg = await (await fetch('/api/config')).json();
      cfgLoaded = true;
      qrAlign = ['top', 'mid', 'bottom'].includes(cfg.qrAlign) ? cfg.qrAlign : 'bottom';
      qrSize = Math.max(0, Math.min(200, Number(cfg.qrSize ?? 100)));
      applyLayout();
      const widgets = (cfg.qrWidgets && cfg.qrWidgets.length)
        ? cfg.qrWidgets
        : [{ jar: cfg.widgetJar || '', color: '#101217', style: 'both', radius: 20, accent: '#8b5cf6' }];
      setWidget(widgets[idx] || (demo ? { jar: '', color: '#101217', style: 'both', radius: 20, accent: '#8b5cf6' } : null));
    } catch (e) { cfgLoaded = false; }
  }

  function paint(jar) {
    if (!jar) {
      $('title').textContent = 'No jar';
      $('raised').textContent = '—'; $('cur').textContent = '';
      $('goal').textContent = '—'; $('fill').style.width = '0%';
      return;
    }
    const cur = jar.currency || '';
    const bal = Number(jar.balance || 0) / 100;
    const goal = Number(jar.goal || 0) / 100;
    $('title').textContent = jar.title || jar.code || 'Jar';
    $('raised').textContent = fmt(bal);
    $('cur').textContent = cur;
    $('goal').textContent = goal > 0 ? fmt(goal) + ' ' + cur : '—';
    $('fill').style.width = (goal > 0 ? Math.max(0, Math.min(100, bal / goal * 100)) : 0) + '%';
  }

  async function refresh() {
    if (!cfgLoaded) await loadCfg();
    if (!widget) return;
    if (demo) {
      // same jar styling/title as the default widget, but fixed numbers for a gradient check
      let base = {};
      try {
        const s = await (await fetch('/api/state')).json();
        const jars = s.jars || [];
        base = jars.find(j => j.code === widget.jar) || jars[0] || {};
      } catch (e) {}
      paint({ ...base, title: base.title || demoJar.title, balance: demoJar.balance, goal: demoJar.goal, currency: base.currency || demoJar.currency });
      return;
    }
    try {
      const s = await (await fetch('/api/state')).json();
      const jars = s.jars || [];
      paint(jars.find(j => j.code === widget.jar) || jars[0]);
    } catch (e) { /* keep the last rendered state */ }
  }

  refresh();
  setInterval(refresh, 4000);
</script>
</body>
</html>
