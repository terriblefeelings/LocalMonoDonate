<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donate QR</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 24px; padding: 24px; box-sizing: border-box; }
  .qr-card {
    background: #fff; padding: 16px; border-radius: 20px; display: flex; flex-direction: column;
    align-items: center; gap: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .qr-card svg { display: block; width: 220px; height: 220px; }
  .qr-card .cap { font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #111; }
  .jar-card {
    min-width: 300px; max-width: 430px; padding: 20px 22px; border-radius: 20px; color: #e9edf3;
    background: rgba(16,18,23,.86); border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 18px 50px rgba(0,0,0,.45); backdrop-filter: blur(10px);
  }
  .jar-card h2 { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
  .jar-card .nums { font-size: 26px; font-weight: 800; letter-spacing: .01em; }
  .jar-card .nums small { font-size: 15px; font-weight: 600; color: #9aa4b2; }
  .bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; margin: 14px 0 8px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 6px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width .4s ease; }
  .meta { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; color: #9aa4b2; }
  .meta b { color: #e9edf3; }
</style>
</head>
<body>
<div id="wrap">
  <div class="qr-card">
    <div id="qr"></div>
    <div class="cap" id="cap">DONATE</div>
  </div>
  <div class="jar-card">
    <h2 id="title">—</h2>
    <div class="nums" id="nums">—</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="meta"><span id="pct"></span><span id="goalLbl"></span></div>
  </div>
</div>
<script src="/qrcode.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(Number(n) || 0).toLocaleString('uk-UA');
  let lastUrl = '', cfg = {}, cfgLoaded = false;

  function renderQr(url) {
    if (!url || url === lastUrl) return;
    lastUrl = url;
    try {
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      $('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, alt: 'Donate' });
    } catch (e) { console.warn(e); }
  }

  async function refresh() {
    try {
      if (!cfgLoaded) {
        try { cfg = await (await fetch('/api/config')).json(); } catch (e) {}
        cfgLoaded = true;
      }
      const s = await (await fetch('/api/state')).json();
      const jars = s.jars || [];
      const pick = jars.find(j => j.code === cfg.widgetJar) || jars[0];
      renderQr(cfg.publicDonate || (cfg.links && cfg.links.donate) || '');
      if (!pick) {
        $('title').textContent = 'No jar';
        $('nums').textContent = '—';
        $('fill').style.width = '0%';
        $('pct').textContent = '';
        $('goalLbl').textContent = '';
        return;
      }
      const cur = pick.currency || '';
      const bal = Number(pick.balance || 0);
      const goal = Number(pick.goal || 0);
      $('title').textContent = pick.title || pick.code || 'Jar';
      $('nums').innerHTML = fmt(bal) + ' ' + cur + (goal > 0 ? ' <small>/ ' + fmt(goal) + ' ' + cur + '</small>' : '');
      const pct = goal > 0 ? Math.max(0, Math.min(100, bal / goal * 100)) : 0;
      $('fill').style.width = pct + '%';
      $('pct').textContent = goal > 0 ? Math.round(pct) + '%' : '';
      $('goalLbl').innerHTML = goal > 0 ? 'GOAL' : '';
    } catch (e) { /* keep last rendered state */ }
  }

  refresh();
  setInterval(refresh, 4000);
</script>
</body>
</html>
