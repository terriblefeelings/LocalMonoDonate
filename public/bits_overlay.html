<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound alerts overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; }
  #stage { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); }
  .notif { display: flex; flex-direction: column; align-items: center; }
  .bitmedia { overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .bitmedia img, .bitmedia video { height: 100%; width: auto; max-width: none; max-height: none; display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="/alert.js"></script>
<script>
const CFG = { videoMaxMs: 180000 };
const MEDIA_W = 720, MEDIA_H = 300;
let RULES = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
function pickStyle(amount, ruleId) {
  if (ruleId) { const r = RULES.find(x => x.id === ruleId); if (r) return r.style || {}; }
  for (const r of RULES) { if (r.id === 'default' || r.pool) continue; const mn = r.min || 0, mx = r.max || 0;
    if (amount + 1e-9 >= mn && (mx <= 0 || amount <= mx + 1e-9)) return r.style || {}; }
  const pool = RULES.filter(r => r.id === 'default' || r.pool);
  if (!pool.length) return {};
  return pool[Math.floor(Math.random() * pool.length)].style || {};
}
async function loadSettings() { try { const s = await (await fetch('/api/state')).json();
  if (s.overlay) Object.assign(CFG, s.overlay); if (s.notify && s.notify.rules) RULES = s.notify.rules; } catch {} }
loadSettings(); setInterval(loadSettings, 5000);

let audioReady = false; const audioRetries = [];
function markAudioReady() { if (audioReady) return; audioReady = true; audioRetries.splice(0).forEach(fn => { try { fn(); } catch {} }); }
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, markAudioReady, { passive: true }));

function playAudio(src, maxMs) { if (!src) return Promise.resolve();
  return new Promise(res => { const a = new Audio(src); let done = false; const fin = () => { if (done) return; done = true; res(); };
    a.onended = fin; a.onerror = fin;
    const p = a.play();
    if (p && p.catch) p.catch(() => { if (!audioReady) audioRetries.push(() => { a.play().catch(() => {}); }); setTimeout(fin, 1000); });
    setTimeout(fin, maxMs || CFG.videoMaxMs); }); }

const queue = []; let busy = false;
function enqueue(d) { queue.push(d); if (!busy) pump(); }
async function pump() { if (!queue.length) { busy = false; return; } busy = true; try { await play(queue.shift()); } catch (e) { console.warn(e); } pump(); }

function mediaBox(url, w, h) {
  const box = document.createElement('div'); box.className = 'bitmedia';
  box.style.width = (w || MEDIA_W) + 'px'; box.style.height = (h || MEDIA_H) + 'px';
  const isVid = Alert.isVidUrl(url);
  const el = document.createElement(isVid ? 'video' : 'img'); el.src = url;
  if (isVid) { el.playsInline = true; el.autoplay = true; el.loop = false; el.muted = false; }
  box.append(el);
  return { box, el, isVid };
}
function videoDone(el) { return new Promise(r => { el.onended = r; el.onerror = r; setTimeout(r, CFG.videoMaxMs); }); }
function startVideo(el) { const pp = el.play(); if (pp && pp.catch) pp.catch(() => { el.muted = true; el.play().catch(() => {}); }); }

async function play(d) {
  const bit = d.bit || {};
  const stage = document.getElementById('stage');

  /* sound -> audio only, no visuals */
  if (bit.kind === 'sound') { await playAudio(bit.url, CFG.videoMaxMs); return; }

  /* alert -> its own media at its own size, no text */
  if (bit.kind === 'alert') {
    const s = pickStyle(0, bit.ruleId);
    const url = s.video_url || s.image_url || '';
    const anim = s.anim_ms || 400;
    if (!url) { await sleep(s.duration_ms || 3000); return; }
    const { box, el, isVid } = mediaBox(url, s.media_w, s.media_h);
    const wrap = document.createElement('div'); wrap.className = 'notif'; wrap.append(box);
    wrap.style.transition = 'none'; wrap.style.opacity = '0'; wrap.style.transform = Alert.animFrom(s.anim_in || 'fade');
    stage.append(wrap); void wrap.offsetWidth;
    wrap.style.transition = `opacity ${anim}ms ease, transform ${anim}ms cubic-bezier(.2,.9,.3,1.2)`;
    wrap.style.opacity = '1'; wrap.style.transform = 'none';
    if (isVid) startVideo(el);
    const snd = s.sound_url ? playAudio(s.sound_url, CFG.videoMaxMs) : Promise.resolve();
    if (isVid || s.sound_url) await Promise.race([Promise.all([isVid ? videoDone(el) : Promise.resolve(), snd]), sleep(CFG.videoMaxMs)]);
    else await sleep(s.duration_ms || 3000);
    wrap.style.transition = `opacity ${anim}ms ease, transform ${anim}ms ease`;
    wrap.style.opacity = '0'; wrap.style.transform = Alert.animFrom(s.anim_out || 'fade');
    await sleep(anim + 60); wrap.remove();
    await afterBit(d);
    return;
  }

  /* video / image -> plain media, 720x300, fill by height */
  const url = bit.url || '';
  if (!url) return;
  const { box, el, isVid } = mediaBox(url, MEDIA_W, MEDIA_H);
  const wrap = document.createElement('div'); wrap.className = 'notif'; wrap.append(box);
  wrap.style.transition = 'none'; wrap.style.opacity = '0';
  stage.append(wrap); void wrap.offsetWidth;
  wrap.style.transition = 'opacity 300ms ease'; wrap.style.opacity = '1';
  if (isVid) startVideo(el);
  const snd = (bit.kind === 'image' && bit.sound) ? playAudio(bit.sound, CFG.videoMaxMs) : Promise.resolve();
  if (isVid) await Promise.race([videoDone(el), sleep(CFG.videoMaxMs)]);
  else if (bit.kind === 'image' && bit.sound) await snd;
  else await sleep(3000);
  wrap.style.transition = 'opacity 300ms ease'; wrap.style.opacity = '0';
  await sleep(360); wrap.remove();
  await afterBit(d);
}

let ytp = null;
function loadYT() { if (ytp) return ytp; ytp = new Promise(res => { if (window.YT && window.YT.Player) return res(); window.onYouTubeIframeAPIReady = () => res(); const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); }); return ytp; }
async function playYT(id, maxMs) { await loadYT(); return new Promise(resolve => { let player, done = false;
  const host = document.createElement('div'); host.style.cssText = 'width:720px;height:300px'; document.getElementById('stage').append(host);
  const fin = () => { if (done) return; done = true; clearTimeout(timer); try { player && player.destroy(); } catch {} host.remove(); resolve(); };
  const timer = setTimeout(fin, maxMs || 180000);
  player = new YT.Player(host, { videoId: id, width: 720, height: 300, playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, modestbranding: 1 },
    events: { onReady: e => e.target.playVideo(), onStateChange: e => { if (e.data === YT.PlayerState.ENDED) fin(); }, onError: () => fin() } }); }); }
async function afterBit(d) { if (d.youtubeId) { await sleep(3000); await playYT(d.youtubeId, CFG.videoMaxMs); } }

let lastId = 0, firstPoll = true;
async function tick() {
  try {
    const d = await (await fetch('/api/poll?since=' + lastId)).json();
    if (typeof d.last === 'number') lastId = d.last;
    if (firstPoll) { firstPoll = false; setTimeout(tick, 800); return; }
    const bits = (d.events || []).map(raw => { try { return JSON.parse(raw); } catch { return null; } }).filter(e => e && e.type === 'bit');
    if (bits.length) await loadSettings();
    for (const ev of bits) enqueue(ev.data);
  } catch {}
  setTimeout(tick, 800);
}
tick();
</script>
</body>
</html>
