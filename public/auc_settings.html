<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auction settings</title>
  <link rel="stylesheet" href="/auc.css" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    html,body{height:auto}
    body{margin:0}
    .wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:24px}
    .wrap h1{font-size:18px;margin:0}
    .wrap .sub{color:var(--muted);font-size:12px;margin:0}
    .wrap a.link{color:var(--accent3);text-decoration:none}
    .status{font-size:13px;color:var(--muted);min-height:18px}
    .status.ok{color:#7ee2a8}.status.err{color:#ff6b6b}
    .setbody .seg{display:inline-flex;gap:6px;flex-wrap:wrap;background:transparent;border:0;padding:0;width:auto}
    .setbody .seg button{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:8px;padding:6px 14px;font-size:13px;height:auto}
    .setbody .seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
    .head{min-height:66px}
    .head .primary{height:37px;line-height:normal}
    .head .brand .logo{height:auto}
    .head .seg button{height:28px;line-height:normal}
    /* follow the app theme (auc.css hardcodes the dark palette) */
    .setpanel{background:var(--card);border-color:var(--line)}
    .setpanel h3{color:var(--fg);border-bottom-color:var(--line)}
    .setpanel h4,.subhead{color:var(--muted)}
    .setbody .field,.wset .field{border-bottom-color:var(--line)}
    .setbody .field label,.wset .field label{color:var(--muted)}
    .setbody input,.setbody select,.wset input,.wset select{background:var(--field);border-color:var(--line);color:var(--fg)}
    .setbody .seg,.wset .seg{background:var(--card2);border-color:var(--line)}
    .setbody .seg button,.wset .seg button{color:var(--muted)}
    .switch i{background:var(--field2)}
    .btn-outline{border-color:var(--line);color:var(--fg)}
    .btn-new{background:var(--accent);color:var(--accent-ink)}
    .setbody .seg button{background:transparent;color:var(--muted)}
    .setbody .seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  </style>
</head>

<div class="wrap">
  <h1 data-i18n="auTitle">Auction settings</h1>
  <p class="sub"><span data-i18n="auSub">Auction-only settings. The Monobank jar / token and the Twitch keys live on the main</span> <a class="link" href="/setup" data-i18n="navSetup">Setup</a> <span data-i18n="auSubEnd">page.</span></p>

  <div class="setbody">
    <div class="setpanel"><h3 data-i18n="auTimer">Timer</h3><div class="in">
      <div class="field"><label data-i18n="auInitial">Initial time (min)</label><input id="t_initial" type="number" min="0" /><div class="note" data-i18n="nInitial"></div></div>
      <label class="switch"><input id="t_showtotal" type="checkbox" /><i></i><span data-i18n="auShowTotal">Show total auction time</span></label>
      <div class="subhead" data-i18n="auLeader">Leader Change</div><div class="note" data-i18n="nLeader"></div>
      <div class="field"><label data-i18n="auPoints">Points (sec)</label><input id="t_lcp" type="number" min="0" /></div>
      <div class="field"><label data-i18n="auDonations">Donations (sec)</label><input id="t_lcd" type="number" min="0" /></div>
      <div class="subhead" data-i18n="auNewPos">New Position</div><div class="note" data-i18n="nNewPos"></div>
      <div class="field"><label data-i18n="auPoints">Points (sec)</label><input id="t_npp" type="number" min="0" /></div>
      <div class="field"><label data-i18n="auDonations">Donations (sec)</label><input id="t_npd" type="number" min="0" /></div>
      <div class="field"><label data-i18n="auAddPoints">Add points to already existing bid (sec)</label><input id="t_aep" type="number" min="0" /></div>
      <div class="field"><label data-i18n="auAddDon">Add donation to already existing bid (sec)</label><input id="t_aed" type="number" min="0" /><div class="note" data-i18n="nExisting"></div></div>
      <h4 data-i18n="auExceptions">Exceptions</h4><div class="note" data-i18n="nException"></div>
      <div class="field"><label data-i18n="auTimeMore">Time is more than (min)</label><input id="t_tmt" type="number" min="0" /></div>
    </div></div>

    <div class="setpanel"><h3 data-i18n="auBids">Bids general</h3><div class="in">
      <div class="field"><label data-i18n="auMode">Mode</label><div class="seg" id="b_mode"><button data-v="manual" data-i18n="auManual">Manual</button><button data-v="auto" data-i18n="auAuto">Automatic</button></div><div class="note" data-i18n="nMode"></div></div>
      <div class="field"><label data-i18n="auSource">Source</label><div class="seg" id="b_source"><button data-v="points" data-i18n="auPtsOnly">Points</button><button data-v="donations" data-i18n="auDonOnly">Donations</button></div><div class="note" data-i18n="nSource"></div></div>
      <div class="field"><label data-i18n="auCurrency">Currency</label><div class="seg" id="b_cur"><button data-v="UAH">UAH</button><button data-v="USD">USD</button></div></div>
      <div class="field"><label data-i18n="auRewardTitle">Reward title</label><input id="tw_reward" /></div>
      <div class="field"><label data-i18n="auRewardCost">Reward cost (points) &mdash; toggle one or more</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="seg" id="b_cost"><button data-v="1000">1k</button><button data-v="5000">5k</button><button data-v="10000">10k</button><button data-v="50000">50k</button><button data-v="100000">100k</button></div><button class="btn-outline" id="b_cost_all" data-i18n="auAll">All</button></div><div class="note" data-i18n="nReward"></div></div>
    </div></div>

    <div class="row"><button class="btn-new" id="aucSave" data-i18n="auSave">Save auction settings</button></div>
    <div class="status" id="status"></div>
  </div>
</div>

Object.assign(window.I18N.ua, { nMode: '\u0412\u0440\u0443\u0447\u043d\u0443 \u2014 \u043f\u0456\u0434\u0442\u0432\u0435\u0440\u0434\u0436\u0443\u0439 \u043a\u043e\u0436\u043d\u0443 \u0441\u0442\u0430\u0432\u043a\u0443; \u0410\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u043d\u043e \u2014 \u0441\u0442\u0430\u0432\u043a\u0438 \u0437\u0430\u0441\u0442\u043e\u0441\u043e\u0432\u0443\u044e\u0442\u044c\u0441\u044f \u043e\u0434\u0440\u0430\u0437\u0443.', nSource: '\u0411\u0430\u043b\u0438 \u2014 \u0431\u0430\u043b\u0438 Twitch; \u0414\u043e\u043d\u0430\u0442\u0438 \u2014 \u0431\u0430\u043d\u043a\u0430 Monobank.', nLeader: '\u0421\u0435\u043a\u0443\u043d\u0434\u0438, \u0449\u043e \u0434\u043e\u0434\u0430\u044e\u0442\u044c\u0441\u044f, \u043a\u043e\u043b\u0438 \u0441\u0442\u0430\u0432\u043a\u0430 \u0432\u0438\u0445\u043e\u0434\u0438\u0442\u044c \u0443 \u043b\u0456\u0434\u0435\u0440\u0438.', nNewPos: '\u0421\u0435\u043a\u0443\u043d\u0434\u0438, \u0449\u043e \u0434\u043e\u0434\u0430\u044e\u0442\u044c\u0441\u044f, \u043a\u043e\u043b\u0438 \u043b\u043e\u0442 \u043f\u0456\u0434\u043d\u0456\u043c\u0430\u0454\u0442\u044c\u0441\u044f \u0432 \u0440\u0435\u0439\u0442\u0438\u043d\u0433\u0443.', nExisting: '\u0421\u0435\u043a\u0443\u043d\u0434\u0438, \u0449\u043e \u0434\u043e\u0434\u0430\u044e\u0442\u044c\u0441\u044f, \u043a\u043e\u043b\u0438 \u0445\u0442\u043e\u0441\u044c \u0441\u0442\u0430\u0432\u0438\u0442\u044c \u043d\u0430 \u043b\u043e\u0442, \u0434\u0435 \u0432\u0436\u0435 \u0454 \u0441\u0442\u0430\u0432\u043a\u0438.', nException: '\u042f\u043a\u0449\u043e \u0442\u0430\u0439\u043c\u0435\u0440 \u0443\u0436\u0435 \u0431\u0456\u043b\u044c\u0448\u0438\u0439 \u0437\u0430 \u0446\u0435 \u2014 \u0447\u0430\u0441 \u043d\u0435 \u0434\u043e\u0434\u0430\u0454\u0442\u044c\u0441\u044f.', nReward: '\u041d\u0430\u0433\u043e\u0440\u043e\u0434\u0430 \u0437\u0430 \u0431\u0430\u043b\u0438 Twitch, \u044f\u043a\u0443 \u0433\u043b\u044f\u0434\u0430\u0447\u0456 \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u044e\u0442\u044c \u0434\u043b\u044f \u0441\u0442\u0430\u0432\u043a\u0438 \u2014 \u0441\u0442\u0432\u043e\u0440\u044e\u0454\u0442\u044c\u0441\u044f \u043f\u043e \u043e\u0434\u043d\u0456\u0439 \u043d\u0430 \u043a\u043e\u0436\u043d\u0443 \u043e\u0431\u0440\u0430\u043d\u0443 \u0432\u0430\u0440\u0442\u0456\u0441\u0442\u044c.', nInitial: '\u0422\u0440\u0438\u0432\u0430\u043b\u0456\u0441\u0442\u044c \u0430\u0443\u043a\u0446\u0456\u043e\u043d\u0443 \u043d\u0430 \u0441\u0442\u0430\u0440\u0442\u0456 (\u043c\u043e\u0436\u0435 \u0437\u0440\u043e\u0441\u0442\u0430\u0442\u0438 \u0437\u0456 \u0441\u0442\u0430\u0432\u043a\u0430\u043c\u0438).' });
const $ = (id) => document.getElementById(id);
let AUC = {};
function seg(id, val) { document.querySelectorAll('#' + id + ' button').forEach(b => { const on = b.dataset.v === val; b.classList.toggle('on', on); b.onclick = () => { val = b.dataset.v; seg(id, val); }; }); }
function segVal(id) { const b = document.querySelector('#' + id + ' button.on'); return b ? b.dataset.v : ''; }
function num(id, v) { $(id).value = Number(v) || 0; }
function val(id) { return Number($(id).value) || 0; }

async function load() {
  // auction settings (exe config)
  try { AUC = await (await fetch('/api/auc/settings')).json(); } catch {}
  num('t_initial', Math.round((AUC.timerSeconds || 0) / 60)); $('t_showtotal').checked = !!AUC.showTotalTime;
  num('t_lcp', AUC.leaderChangePoints); num('t_lcd', AUC.leaderChangeDonations);
  num('t_npp', AUC.newPositionPoints); num('t_npd', AUC.newPositionDonations);
  num('t_aep', AUC.addExistingPoints); num('t_aed', AUC.addExistingDonations);
  num('t_tmt', AUC.timeMoreThanMin);
  $('tw_reward').value = AUC.rewardTitle || 'Bid';
  seg('b_mode', AUC.mode || 'manual'); seg('b_source', AUC.source || 'points'); seg('b_cur', AUC.currency || 'UAH');
  const costs = ((AUC.rewardCosts && AUC.rewardCosts.length) ? AUC.rewardCosts : [1000]).map(Number);
  document.querySelectorAll('#b_cost button').forEach(b => { b.classList.toggle('on', costs.includes(Number(b.dataset.v))); b.onclick = () => b.classList.toggle('on'); });
  $('b_cost_all').onclick = () => { const bs = document.querySelectorAll('#b_cost button'); const allOn = [...bs].every(b => b.classList.contains('on')); bs.forEach(b => b.classList.toggle('on', !allOn)); };
}

async function post(url, body) { try { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); return await r.json(); } catch { return {}; } }
function say(ok, msg) { $('status').className = 'status ' + (ok ? 'ok' : 'err'); $('status').textContent = msg; }

$('aucSave').onclick = async () => {
  const body = {
    mode: segVal('b_mode'), source: segVal('b_source'), currency: segVal('b_cur'),
    timerSeconds: val('t_initial') * 60, showTotalTime: $('t_showtotal').checked,
    leaderChangePoints: val('t_lcp'), leaderChangeDonations: val('t_lcd'),
    newPositionPoints: val('t_npp'), newPositionDonations: val('t_npd'),
    addExistingPoints: val('t_aep'), addExistingDonations: val('t_aed'), timeMoreThanMin: val('t_tmt'),
    rewardTitle: $('tw_reward').value, rewardCosts: [...document.querySelectorAll('#b_cost button.on')].map(b => Number(b.dataset.v)),
  };
  await post('/api/auc/settings', body);
  say(true, 'saved');
};
load();
window.savePage = () => $('aucSave').click();
</script>
