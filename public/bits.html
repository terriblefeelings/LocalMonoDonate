<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="title">Звукові сповіщення</title>
<link rel="stylesheet" href="/app.css">
<style>
  body{background-size:100% 100%;background-position:center;background-attachment:scroll;background-repeat:no-repeat;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  body:not(.hasbg){background-image:none!important}
  .wrap{max-width:660px;width:100%}
  .deck{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 12px;background-size:100% 100%;background-position:center;background-repeat:no-repeat;border-radius:var(--r-sm)}
  #win{background-size:100% 100%;background-position:center;background-repeat:no-repeat}
  .cell{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
  .cell .sq{width:100%;aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;
    font-size:22px;background-color:var(--card2);overflow:hidden;transition:.12s}
  .cell .sq img{width:100%;height:100%;object-fit:cover;display:block}
  .cell:hover .sq{border-color:var(--accent);transform:translateY(-2px)}
  .cell.empty{cursor:default}
  .cell.empty .sq{border-style:dashed;opacity:.35}
  .cell.empty:hover .sq{transform:none;border-color:var(--line)}
  .cell .lbl{font-size:12px;font-weight:600;line-height:1.15;color:var(--fg);text-align:center;word-break:break-word}
  .cell .price{font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}
  .cell{position:relative}
  .cell.sel .sq{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
  .cell.sel .lbl{color:var(--accent)}
  .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
  .modebtn{width:100%;min-height:34px;padding:0 10px}
  #modes .modebtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .modebtn:disabled{opacity:.35;cursor:not-allowed}
  .selbar{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);display:flex;flex-direction:column;gap:8px;background:var(--card2)}
  .selbar[hidden]{display:none}
  .seltext{font-size:12px;line-height:1.4;color:var(--muted);text-align:left}
  .selrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
  #selpay{min-width:150px;min-height:40px;padding:0 16px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  .deck.dense .cell .lbl,.deck.dense .cell .price{position:absolute;left:3px;right:3px;z-index:1;padding:1px 3px;background:rgba(0,0,0,.62);border-radius:2px;font-size:9px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .deck.dense .cell .lbl{bottom:17px}
  .deck.dense .cell .price{bottom:3px}
  .pvbtn{position:absolute;top:6px;right:6px;width:26px!important;min-width:26px!important;height:26px!important;min-height:26px!important;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.6);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:.12s;padding:0!important}
  .cell:hover .pvbtn{opacity:1}
  #pv{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  #pv.show{display:flex}
  #pv .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:92vw;max-height:92vh}
  #pv .media{display:flex;align-items:center;justify-content:center;max-width:84vw;max-height:64vh;overflow:hidden}
  #pv .media img,#pv .media video{max-width:84vw;max-height:64vh;display:block}
  #pv .ph{padding:28px 18px;color:var(--muted);font-size:14px}
  #pv .ctl{display:flex;align-items:center;gap:10px}

.credits{max-width:560px;margin:18px auto 0;padding:0 16px;text-align:center;font-size:11px;line-height:1.55;color:var(--muted);opacity:.8;pointer-events:auto}
.credits a{color:inherit;text-decoration:underline}
.credits b{font-weight:600}
  body.hasbg .credits{background:rgba(0,0,0,.95);border-radius:4px;padding:8px 12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel" id="win">
    <div class="sec"><span class="h" data-i18n="title">Звукові сповіщення</span><span class="sp"></span><span class="seg" id="langseg"></span></div>
    <div class="body">
      <div style="display:flex;gap:8px;align-items:center;margin:0 0 12px">
        <label for="nick" data-i18n="nick" style="font-size:12px;opacity:.75;white-space:nowrap">Your nickname</label>
        <input id="nick" maxlength="40" autocomplete="nickname" data-i18n-ph="nickPh" placeholder="nickname (optional)" style="flex:1;min-width:0">
      </div>
      <div class="modes" id="modes">
        <button type="button" class="modebtn" data-mode="single" data-i18n="modeSingle">Single</button>
        <button type="button" class="modebtn" data-mode="order" data-i18n="modeOrder">In Order</button>
        <button type="button" class="modebtn" data-mode="adhd" data-i18n="modeAdhd">ADHD</button>
      </div>
      <div class="deck" id="deck"></div>
      <div class="selbar" id="selbar" hidden>
        <div class="seltext" id="seltext"></div>
        <div class="selrow"><span id="seltotal"></span><button type="button" id="selpay" data-i18n="paySelected">Pay</button></div>
      </div>
    </div>
  </div>
  <div class="credits" id="credits"></div>
</div>
<div id="pv"><div class="box"><div class="media" id="pvMedia"></div><div class="ctl"><button id="pvPlay">▶</button><input type="range" id="pvVol" min="0" max="1" step="0.01" value="0.7" style="width:120px"><button id="pvClose">✕</button></div></div></div>
<div id="paydlg" style="position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:60;padding:16px">
  <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;width:min(94vw,420px);display:flex;flex-direction:column;gap:10px;align-items:stretch">
    <div id="payTitle" style="font-weight:600;font-size:14px"></div>
    <input id="payNick" maxlength="40" data-i18n-ph="nickPh" placeholder="nickname (optional)">
    <span style="text-align:left;font-size:12.5px;color:var(--muted)" data-i18n="payDirect">Перейти до оплати напряму до Монобанки пана стрімера</span>
    <a class="btn" id="payGo" target="_blank" rel="noopener" data-i18n="payGo" style="display:flex;width:100%;justify-content:center">Перейти</a>
    <span style="text-align:left;font-size:11.5px;line-height:1.5;color:var(--muted)" data-i18n="payNote">Примітка: якщо не хочете, щоб застосунок Monobank відкривався автоматично, натисніть і утримуйте кнопку «Перейти» і виберіть «Відкрити в новій вкладці браузера» або, за потреби, «Копіювати посилання».</span>
    <button class="btn" id="payClose" type="button" data-i18n="payClose" style="width:100%">Закрити</button>
  </div>
</div>
<script src="/i18n.js"></script>
<script>
window.I18N_DEFAULT = 'ua';
window.I18N = {
  en: { title: 'Sound Alerts', sub: 'Pick what plays on your stream — payment opens in Monobank', empty: 'No alerts yet' },
  ua: { title: 'Звукові сповіщення', sub: 'Обери, що зіграє в ефірі — оплата відкриється в Monobank', empty: 'Поки що немає жодного сповіщення' }
};
const $ = id => document.getElementById(id);
Object.assign(window.I18N.en, { nick: 'Your nickname', nickPh: 'nickname (optional)', payDirect: 'Pay directly in the streamer\'s Monobank', payGo: 'Open', payClose: 'Close', payNote: 'Note: If you do not want the Monobank app to open automatically, long press the Open button and choose either Open in new browser tab or, if you want to do it manually, Copy link.' });
Object.assign(window.I18N.ua, { nick: 'Твій нік', nickPh: 'нік (необовʼязково)', payDirect: 'Перейти до оплати напряму до Монобанки пана стрімера', payGo: 'Перейти', payClose: 'Закрити', payNote: 'Примітка: якщо не хочете, щоб застосунок Monobank відкривався автоматично, натисніть і утримуйте кнопку «Перейти» і виберіть «Відкрити в новій вкладці браузера» або, за потреби, «Копіювати посилання».' });
Object.assign(window.I18N.en, { modeSingle: 'Single', modeOrder: 'In Order', modeAdhd: 'ADHD', paySelected: 'Pay', orderText: 'Order', selectedText: 'Selected', payOrderError: 'Could not create the order. Try again.' });
Object.assign(window.I18N.ua, { modeSingle: '\u041e\u0434\u043d\u0435', modeOrder: '\u041f\u043e \u0447\u0435\u0440\u0437\u0456', modeAdhd: 'ADHD', paySelected: '\u041e\u043f\u043b\u0430\u0442\u0438\u0442\u0438', orderText: '\u041f\u043e\u0440\u044f\u0434\u043e\u043a', selectedText: '\u041e\u0431\u0440\u0430\u043d\u0456', payOrderError: '\u041d\u0435 \u0432\u0434\u0430\u043b\u043e\u0441\u044f \u0441\u0442\u0432\u043e\u0440\u0438\u0442\u0438 \u0437\u0430\u043c\u043e\u0432\u043b\u0435\u043d\u043d\u044f. \u0421\u043f\u0440\u043e\u0431\u0443\u0439 \u0449\u0435 \u0440\u0430\u0437.' });
Object.assign(window.I18N.en, { totalAmount: 'Total Amount' });
Object.assign(window.I18N.ua, { totalAmount: '\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0430 \u0441\u0443\u043c\u0430' });
try { $('nick').value = localStorage.getItem('lmd:nick') || ''; } catch (e) {}
let BITS = [], JAR = '', GRID = 5, MODES = [], MODE = '', SELECTED = [], payOrder = null;
const fmt = n => Math.round(Number(n) || 0).toLocaleString('uk-UA') + ' \u20B4';
const icon = k => k === 'video' ? '🎬' : k === 'sound' ? '🔊' : '✨';
function fitDeck() {
  const wrap = document.querySelector('.wrap');
  if (!wrap) return;
  wrap.style.maxWidth = '660px';
  let guard = 0;
  const fits = () => wrap.getBoundingClientRect().bottom + 20 <= window.innerHeight;
  while (!fits() && guard++ < 80) {
    const width = wrap.getBoundingClientRect().width;
    if (width <= 300) break;
    wrap.style.maxWidth = Math.max(300, Math.floor(width * 0.98)) + 'px';
  }
}
window.addEventListener('resize', fitDeck);
function render() {
  const g = $('deck'); g.innerHTML = '';
  const bits = BITS.filter(b => Number(b.slot) < GRID * GRID).sort((a, b) => (Number(a.slot) || 0) - (Number(b.slot) || 0));
  const cols = Math.max(1, Math.min(GRID, bits.length || 1));
  g.classList.toggle('dense', cols >= 6);
  g.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
  for (const bit of bits) {
    const cell = document.createElement('div');
    const multi = (MODE === 'order' || MODE === 'adhd');
    cell.className = 'cell' + (multi && SELECTED.includes(bit.code) ? ' sel' : '');
    const sq = document.createElement('div'); sq.className = 'sq';
    if (bit.img) { const im = document.createElement('img'); im.src = bit.img; im.alt = ''; sq.append(im); }
    else sq.textContent = icon(bit.kind);
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = bit.label || bit.kind;
    const pr = document.createElement('span'); pr.className = 'price'; pr.textContent = fmt(bit.price);
    cell.append(sq, lbl, pr);
    const pb = document.createElement('button'); pb.className = 'pvbtn'; pb.type = 'button'; pb.textContent = '▶'; pb.title = 'Preview';
    pb.onclick = e => { e.stopPropagation(); openPv(bit); };
    cell.append(pb);
    cell.onclick = () => {
      if (!JAR) return;
      if (MODE === 'single') { openPay(bit); return; }
      if (!MODE) return;
      const i = SELECTED.indexOf(bit.code);
      if (i >= 0) SELECTED.splice(i, 1); else SELECTED.push(bit.code);
      render();
    };
    g.append(cell);
  }
  syncSelection();
  fitDeck();
}
function selectedBits() {
  return SELECTED.map(c => BITS.find(b => b.code === c)).filter(Boolean);
}
function syncModes() {
  document.querySelectorAll('.modebtn').forEach(b => {
    const enabled = MODES.includes(b.dataset.mode);
    b.disabled = !enabled;
    b.classList.toggle('off', !enabled);
    b.classList.toggle('on', MODE === b.dataset.mode);
    b.setAttribute('aria-pressed', String(MODE === b.dataset.mode));
  });
}
function syncSelection() {
  const bar = $('selbar'), text = $('seltext'), total = $('seltotal');
  const multi = MODE === 'order' || MODE === 'adhd';
  const bits = selectedBits();
  if (!multi || !bits.length) { bar.hidden = true; return; }
  bar.hidden = false;
  const names = bits.map(b => b.label || b.kind);
  text.textContent = window.t(MODE === 'adhd' ? 'selectedText' : 'orderText') + ': ' + names.join(MODE === 'adhd' ? ', ' : ' → ');
  total.textContent = window.t('totalAmount') + ': ' + fmt(bits.reduce((s, b) => s + (Number(b.price) || 0), 0));
}
document.querySelectorAll('.modebtn').forEach(b => b.addEventListener('click', () => {
  const m = b.dataset.mode;
  if (!MODES.includes(m)) return;
  if (MODE !== m) SELECTED = [];
  MODE = m; syncModes(); render();
}));
$('selpay').onclick = () => openPayMulti();
let pvEl = null;
function openPv(bit) {
  const m = $('pvMedia'); m.innerHTML = ''; pvEl = null;
  const vol = Number($('pvVol').value) || 0.7;
  const url = bit.url || bit.img || '';
  const isVid = /\.(mp4|webm|mov|m4v)(\?|$)/i.test(url);
  const isAudio = !isVid && (bit.kind === 'sound' || /\.(mp3|wav|ogg|m4a|aac)(\?|$)/i.test(url));
  const setBtn = () => { $('pvPlay').textContent = (pvEl && !pvEl.paused) ? '⏸' : '▶'; };
  if (isVid) {
    const v = document.createElement('video'); v.src = url; v.loop = false; v.controls = false; v.playsInline = true; v.volume = vol;
    v.onended = setBtn; m.append(v); pvEl = v; v.play().catch(() => {});
  } else if (isAudio && url) {
    const a = new Audio(url); a.loop = false; a.volume = vol; a.onended = setBtn; a.play().catch(() => {});
    pvEl = a;
    const ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = '🔊 ' + (bit.label || ''); m.append(ph);
  } else if (url) {
    const img = document.createElement('img'); img.src = url; m.append(img);
    if (bit.sound) { const a = new Audio(bit.sound); a.loop = false; a.volume = vol; a.onended = setBtn; pvEl = a; a.play().catch(() => {}); }
  }
  setBtn();
  $('pv').classList.add('show');
}
function closePv() { try { if (pvEl) pvEl.pause(); } catch {} pvEl = null; $('pv').classList.remove('show'); $('pvMedia').innerHTML = ''; }
$('pvPlay').onclick = () => { if (!pvEl) return; if (pvEl.paused) { pvEl.play().catch(() => {}); } else { pvEl.pause(); } $('pvPlay').textContent = pvEl.paused ? '▶' : '⏸'; };
$('pvVol').oninput = () => { if (pvEl) pvEl.volume = Number($('pvVol').value); };
$('pvClose').onclick = closePv;
$('pv').onclick = e => { if (e.target.id === 'pv') closePv(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePv(); });
async function load() {
  let bitsPageBg = '', bitsBg = '', pageBg = '';
  try { const b = await (await fetch('/api/bits')).json(); BITS = b.bits || []; JAR = (b.jars && b.jars[0]) || ''; GRID = b.grid || 5;
    MODES = Array.isArray(b.modes) ? b.modes.filter(m => ['single', 'order', 'adhd'].includes(m)) : (['single', 'order', 'adhd'].includes(b.mode) ? [b.mode] : ['single']);
    MODE = MODES.includes('single') ? 'single' : (MODES[0] || '');
  } catch {}
  try { const c = await (await fetch('/api/config')).json(); bitsPageBg = c.bitsPageBg || ''; bitsBg = c.bitsBg || ''; pageBg = bitsPageBg || c.bg || ''; } catch {}
  document.body.classList.toggle('hasbg', !!pageBg);
  if (pageBg) document.body.style.backgroundImage = 'url("' + pageBg + '")';
  const win = $('win');
  const alpha = bitsBg ? 1 : (pageBg ? 0.95 : 1);
  if (bitsBg) win.style.backgroundImage = 'url("' + bitsBg + '")';
  win.style.backgroundColor = 'color-mix(in srgb,var(--card) ' + (alpha * 100) + '%,transparent)';
  const cellAlpha = bitsBg ? 1 : (pageBg ? 0.95 : 1);
  syncModes();
  render();
  document.querySelectorAll('.cell .sq').forEach(sq => { if (!sq.style.backgroundImage) sq.style.backgroundColor = 'color-mix(in srgb,var(--card2) ' + (cellAlpha * 100) + '%,transparent)'; });
  window.mountLangSeg($('langseg')); window.applyI18n();
}
function payLink(order, nick) {
  if (!order || !order.code) return '';
  const comment = 'донат сповіщення ' + order.code + (nick ? ' | name: ' + nick : '');
  return 'https://send.monobank.ua/jar/' + encodeURIComponent(JAR) + '?a=' + encodeURIComponent(order.total) + '&t=' + encodeURIComponent(comment);
}
function payNickValue() {
  return (($('payNick') && $('payNick').value) || '').trim().slice(0, 40);
}
function payTitleText(order) {
  const bits = order.bits || [];
  if (order.mode === 'single' && bits.length === 1) return (bits[0].label || bits[0].kind) + ' — ' + fmt(order.total);
  return bits.map(b => b.label || b.kind).join(', ') + ' — ' + fmt(order.total);
}
function syncPayLink() {
  const go = $('payGo');
  if (!payOrder || !payOrder.code) { go.removeAttribute('href'); go.style.opacity = .45; return; }
  go.href = payLink(payOrder, payNickValue());
  go.style.opacity = 1;
}
async function createPayOrder() {
  const order = payOrder;
  if (!order) return;
  try {
    const r = await fetch('/api/bits/order', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bits: order.bits.map(b => b.code), mode: order.mode }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'error');
    if (payOrder !== order) return;
    order.code = d.code;
    order.total = Number(d.amount) || order.total;
    $('payTitle').textContent = payTitleText(order);
    syncPayLink();
  } catch (e) {
    if (payOrder === order) { order.code = ''; $('payTitle').textContent = 'Error: ' + (e.message || 'try again'); syncPayLink(); }
  }
}
function openPay(bit) {
  payOrder = { mode: 'single', bits: [bit], total: Number(bit.price) || 0, code: '' };
  $('payTitle').textContent = payTitleText(payOrder);
  $('payNick').value = (($('nick') && $('nick').value) || '').trim();
  syncPayLink();
  $('paydlg').style.display = 'flex';
  createPayOrder();
}
function openPayMulti() {
  const bits = selectedBits();
  if (!bits.length || !(MODE === 'order' || MODE === 'adhd')) return;
  payOrder = { mode: MODE, bits, total: bits.reduce((s, b) => s + (Number(b.price) || 0), 0), code: '' };
  $('payTitle').textContent = payTitleText(payOrder);
  $('payNick').value = (($('nick') && $('nick').value) || '').trim();
  syncPayLink();
  $('paydlg').style.display = 'flex';
  createPayOrder();
}$('payNick').oninput = syncPayLink;
$('payGo').onclick = () => {
  const nick = payNickValue();
  try { localStorage.setItem('lmd:nick', nick); } catch (e) {}
  if ($('nick')) $('nick').value = nick;
};
$('payClose').onclick = () => { $('paydlg').style.display = 'none'; payOrder = null; };
$('paydlg').onclick = e => { if (e.target.id === 'paydlg') $('payClose').onclick(); };
load();
setTimeout(fitDeck, 300);

function renderCredits() {
  const el = document.getElementById('credits'); if (!el) return;
  const ua = window.getLang && window.getLang() === 'ua';
  el.innerHTML = ua
    ? 'Нічого тут не зроблено by <b>terriblefeelings</b> — код написали моделі opencode. Оригінальний код таймера марафону — <a href="https://github.com/stalexteam" target="_blank" rel="noopener">stalexteam</a>, перероблено моделями opencode.'
    : 'Nothing here was made by <b>terriblefeelings</b> — the code was written by opencode models. The marathon timer\'s original code is by <a href="https://github.com/stalexteam" target="_blank" rel="noopener">stalexteam</a>, remade by opencode models.';
}
renderCredits();
window.applyLang = function () { renderCredits(); syncSelection(); fitDeck(); };
window.addEventListener('load', fitDeck);
</script>
</body>
</html>
