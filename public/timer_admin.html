<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer — LocalMonoDonate</title>
<link rel="stylesheet" href="/app.css">
<style>
  .wrap{max-width:900px}
  .ctlrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctlrow select{width:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .grid.two{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .cell{display:flex;flex-direction:column;gap:6px;min-width:0}
  .cell label{font-size:12px;color:var(--muted)}
  .span2{grid-column:span 2}
  .sep{height:1px;background:var(--line);margin:14px 0}
  .sub{font-size:12px;color:var(--muted);margin:0 0 8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  tr:last-child td{border-bottom:0}
  .scroll{max-height:300px;overflow:auto}
  .pill{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.run{color:#39d98a;border-color:#39d98a66}
  .pill.bad{color:#ff6b6b;border-color:#ff6b6b66}
  .preview{position:relative;height:230px;border-radius:12px;background:#0c0c10;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;container-type:size}
  .pv-t{font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .pv-pop{position:absolute;left:50%;top:14%;transform:translateX(-50%);white-space:nowrap;font-weight:700;font-size:6cqh}
  ol.guide{margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.9;color:var(--fg)}
  ol.guide code{background:var(--field2);padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:12px}
  .u{width:84px}
  .masked{filter:blur(5px);user-select:none}
</style>
</head>

<div class="wrap">
  <div class="status" id="status"></div>

  <div class="panel">
    <div class="sec"><span class="h" data-i18n="tPreview"></span><span class="sp"></span><span class="pill" id="state"></span></div>
    <div class="body">
      <div class="preview" id="preview">
        <div class="pv-pop" id="pvPop">+5:00</div>
        <div class="pv-t" id="pvT">--:--:--</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="sec"><span class="n">01</span><span class="h" data-i18n="tTimer"></span></div>
    <div class="body">
      <div class="ctlrow">
        <button id="start" data-i18n="tStart"></button>
        <button id="pause" data-i18n="tPause"></button>
        <button id="reset" data-i18n="tReset"></button>
      </div>
      <div class="sep"></div>
      <div class="sub" data-i18n="tSetLbl"></div>
      <div class="ctlrow">
        <input type="number" id="setD" min="0" class="u" data-i18n-ph="uD">
        <input type="number" id="setH" min="0" class="u" data-i18n-ph="uH">
        <input type="number" id="setM" min="0" class="u" data-i18n-ph="uM">
        <input type="number" id="setS" min="0" class="u" data-i18n-ph="uS">
        <button id="setBtn" data-i18n="tSet"></button>
      </div>
      <div class="sep"></div>
      <div class="sub" data-i18n="tAdjustLbl"></div>
      <div class="ctlrow">
        <input type="number" id="addN" min="0" value="5" class="u">
        <select id="addU"><option value="86400" data-i18n="uD"></option><option value="3600" data-i18n="uH"></option><option value="60" selected data-i18n="uM"></option><option value="1" data-i18n="uS"></option></select>
        <button id="addBtn" data-i18n="tAdd"></button>
      </div>
      <div class="ctlrow" style="margin-top:8px">
        <input type="number" id="subN" min="0" value="5" class="u">
        <select id="subU"><option value="86400" data-i18n="uD"></option><option value="3600" data-i18n="uH"></option><option value="60" selected data-i18n="uM"></option><option value="1" data-i18n="uS"></option></select>
        <button id="subBtn" data-i18n="tSub"></button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="sec"><span class="n">02</span><span class="h" data-i18n="tRates"></span></div>
    <div class="body">
      <div class="grid">
        <div class="cell"><label data-i18n="tPerAmount"></label><input type="number" id="perAmount" min="1"></div>
        <div class="cell"><label data-i18n="tPerSeconds"></label><input type="number" id="perSeconds" min="0"></div>
        <div class="cell"><label data-i18n="tMin"></label><input type="number" id="minDonation" min="0"></div>
        <div class="cell"><label data-i18n="tPoll"></label><input type="number" id="pollSeconds" min="15"></div>
        <div class="cell"><label data-i18n="tT1"></label><input type="number" id="twitchTier1" min="0"></div>
        <div class="cell"><label data-i18n="tT2"></label><input type="number" id="twitchTier2" min="0"></div>
        <div class="cell"><label data-i18n="tT3"></label><input type="number" id="twitchTier3" min="0"></div>
      </div>
      <div class="note" data-i18n="tRatesNote"></div>
    </div>
  </div>

  <div class="panel">
    <div class="sec"><span class="n">03</span><span class="h" data-i18n="tLook"></span></div>
    <div class="body">
      <div class="grid">
        <div class="cell"><label data-i18n="tColor"></label><input type="color" id="color"></div>
        <div class="cell"><label data-i18n="tAccent"></label><input type="color" id="accent"></div>
        <div class="cell"><label data-i18n="tOutline"></label><input type="color" id="outline"></div>
        <div class="cell"><label data-i18n="tSize"></label><input type="number" id="size" min="1"></div>
        <div class="cell"><label data-i18n="tFont"></label><select id="font"></select></div>
      </div>
    </div>
  </div>


  <div class="panel">
    <div class="sec"><span class="h" data-i18n="tLog"></span><span class="sp"></span>
      <span class="pill" id="statSubs">—</span><span class="pill" id="statMoney" style="margin-left:8px">—</span></div>
    <div class="body"><div class="scroll"><table id="log">
      <thead><tr><th data-i18n="tColSrc"></th><th data-i18n="tColWho"></th><th data-i18n="tColAmt"></th><th data-i18n="tColSec"></th><th data-i18n="tColAt"></th></tr></thead>
      <tbody></tbody></table></div></div>
  </div>
</div>

    tLog: '\u0416\u0443\u0440\u043d\u0430\u043b', tStatSubs: '\u041f\u0456\u0434\u043f\u0438\u0441\u043a\u0438', tStatMoney: '\u0414\u043e\u043d\u0430\u0442\u0438', tColSrc: '\u0414\u0436\u0435\u0440\u0435\u043b\u043e', tColWho: '\u0425\u0442\u043e', tColAmt: '\u0421\u0443\u043c\u0430', tColSec: '\u0427\u0430\u0441', tColAt: '\u041a\u043e\u043b\u0438',
    tRunning: '\u0410\u043a\u0442\u0438\u0432\u043d\u0438\u0439', tPaused: '\u041f\u0430\u0443\u0437\u0430' }
};
window.I18N_DEFAULT = 'en';
const $ = id => document.getElementById(id);
function status(m, err) { $('status').className = 'status' + (err ? ' err' : ' ok'); $('status').textContent = m; }
function fmt(ms) { ms = Math.max(0, ms | 0); const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60, p = n => String(n).padStart(2, '0');
  return (h > 0 ? p(h) + ':' : '') + p(m) + ':' + p(ss); }
function hex(s, def) { return /^#[0-9a-fA-F]{6}$/.test(s || '') ? s : (def || '#ffffff'); }
const uah = n => Math.round(Number(n) || 0).toLocaleString('uk-UA') + ' \u20B4';
let last = null, lastAt = 0;

function preview() {
  const fam = ($('font').value ? '"' + $('font').value + '", monospace' : '"JetBrains Mono", ui-monospace, monospace');
  const t = $('pvT');
  const ms = last ? (last.running ? last.remainingMs - (Date.now() - lastAt) : last.remainingMs) : 0;
  t.textContent = fmt(ms);
  t.style.color = hex($('color').value);
  t.style.fontSize = (Number($('size').value) || 22) + 'cqw';
  t.style.textShadow = '3px 3px 0 ' + ($('outline').value || '#000');
  t.style.fontFamily = fam;
  const p = $('pvPop');
  p.style.color = hex($('accent').value);
  p.style.textShadow = '2px 2px 0 ' + ($('outline').value || '#000');
  p.style.fontFamily = fam;
}
['color','accent','size','outline','font'].forEach(id => $(id).addEventListener('input', preview));
async function loadFonts() {
  try { const d = await (await fetch('/api/fonts')).json();
    $('font').innerHTML = '<option value="">' + window.t('tFontDefault') + '</option>' + (d.fonts || []).map(f => '<option value="' + f + '">' + f + '</option>').join('');
  } catch {}
}
function setFont(name) { const sel = $('font'); name = name || '';
  if (name && ![...sel.options].some(o => o.value === name)) { const o = document.createElement('option'); o.value = name; o.textContent = name; sel.append(o); }
  sel.value = name; }

function applyCfg(c) {
  $('perAmount').value = c.perAmount ?? 10; $('perSeconds').value = c.perSeconds ?? 60;
  $('minDonation').value = c.minDonation ?? 10; $('pollSeconds').value = c.pollSeconds ?? 60;
  $('twitchTier1').value = c.twitchTier1 ?? 0; $('twitchTier2').value = c.twitchTier2 ?? 0; $('twitchTier3').value = c.twitchTier3 ?? 0;
  $('color').value = hex(c.color); $('accent').value = hex(c.accent); $('outline').value = hex(c.outline, '#000000');
  $('size').value = c.size ?? 22; setFont(c.font);
  preview();
}
function paint(d) {
  $('state').textContent = d.running ? window.t('tRunning') : window.t('tPaused');
  $('state').className = 'pill' + (d.running ? ' run' : '');
  $('statSubs').textContent = window.t('tStatSubs') + ': ' + (d.subs || 0);
  $('statMoney').textContent = window.t('tStatMoney') + ': ' + uah(d.money || 0);
  preview();
  const tb = $('log').querySelector('tbody'); tb.innerHTML = '';
  for (const e of (d.log || []).slice(0, 60)) { const tr = document.createElement('tr'); tr.innerHTML = '<td></td><td></td><td></td><td></td><td></td>';
    tr.children[0].textContent = e.source; tr.children[1].textContent = e.label || '—';
    tr.children[2].textContent = e.amount ? e.amount + ' ?' : '·';
    tr.children[3].textContent = (e.seconds > 0 ? '+' : '') + e.seconds + 's';
    tr.children[4].textContent = new Date(e.at).toLocaleString(); tb.append(tr); }
}
async function act(action, seconds) {
  try { const r = await fetch('/api/timer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, seconds }) });
    const d = await r.json(); last = d; paint(d); } catch {}
}
async function poll() { try { const d = await (await fetch('/api/timer')).json(); last = d; lastAt = Date.now(); paint(d); } catch {} }
async function init() {
  let cfg = {};
  try { const d = await (await fetch('/api/timer')).json(); last = d; cfg = d.cfg || {}; } catch {}
  await loadFonts();
  applyCfg(cfg); setFont(cfg.font);
  if (last) paint(last);
}
$('start').onclick = () => act('resume');
$('pause').onclick = () => act('pause');
$('reset').onclick = () => act('reset');
$('setBtn').onclick = () => act('set', (Number($('setD').value) || 0) * 86400 + (Number($('setH').value) || 0) * 3600 + (Number($('setM').value) || 0) * 60 + (Number($('setS').value) || 0));
$('addBtn').onclick = () => act('add', (Number($('addN').value) || 0) * (Number($('addU').value) || 1));
$('subBtn').onclick = () => act('sub', (Number($('subN').value) || 0) * (Number($('subU').value) || 1));

// Twitch keys + guide moved to the Setup page
window.savePage = async () => {
  const body = { perAmount: Number($('perAmount').value) || 0, perSeconds: Number($('perSeconds').value) || 0,
    minDonation: Number($('minDonation').value) || 0, pollSeconds: Number($('pollSeconds').value) || 60,
    twitchTier1: Number($('twitchTier1').value) || 0, twitchTier2: Number($('twitchTier2').value) || 0, twitchTier3: Number($('twitchTier3').value) || 0,
    color: $('color').value, accent: $('accent').value, outline: $('outline').value, size: Number($('size').value) || 22,
    font: $('font').value };
  try { const r = await fetch('/api/timer/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const x = await r.json(); status(x.ok ? 'saved' : 'save error', !x.ok); } catch { status('save error', true); }
};
window.applyLang = () => { if (last) paint(last); };
init(); setInterval(poll, 2000); setInterval(preview, 500);</script>
