<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Підтримати</title>
<link rel="stylesheet" href="/app.css">
<style>
  body{background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{max-width:560px;width:100%}
  .row .ctl{max-width:none}

.credits{position:static;margin:18px auto 0;max-width:560px;padding:0 16px;text-align:center;font-size:11px;line-height:1.55;color:var(--muted);opacity:.8;pointer-events:auto}
.paynote{margin:10px 2px 0;text-align:center;font-size:12.5px;line-height:1.55;color:var(--muted)}
.paynote a{font-weight:700;color:var(--fg);text-decoration:underline}
.paynote[hidden]{display:none}
.credits a{color:inherit;text-decoration:underline}
.credits b{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="sec"><span class="n">01</span><span class="h" id="brand">Підтримати стрім</span><span class="sp"></span><span class="seg" id="langseg"></span></div>
    <div class="body">
      <div class="row" id="row_jar"><label data-i18n="jar">Банка</label><div class="ctl"><select id="jar"></select><div class="note" id="jarThNote" style="display:none"></div></div></div>
      <div class="row" id="row_bit"><label data-i18n="bit">Сповіщення (біт)</label><div class="ctl"><select id="bit"></select></div></div>
      <div class="row"><label data-i18n="amount">Сума, ₴</label><div class="ctl"><input id="amount" type="number" inputmode="numeric" step="1" required></div></div>
      <div class="row"><label data-i18n="name">Ім'я</label><div class="ctl"><input id="name" type="text" maxlength="40" required data-i18n-ph="namePh" placeholder="Напр. Іван"></div></div>
      <div class="row"><label data-i18n="message">Повідомлення</label><div class="ctl"><textarea id="message" maxlength="500" required data-i18n-ph="msgPh" placeholder="Напр. Привіт усім!" style="min-height:84px;resize:vertical"></textarea></div></div>
      <div class="row"><label data-i18n="youtube">Посилання на YouTube (необов'язково)</label><div class="ctl"><input id="youtube" type="text" placeholder="https://youtu.be/..."></div></div>
      <div class="row"><label data-i18n="voice">Голос</label><div class="ctl"><select id="voice"></select></div></div>
      <div class="note" id="hint"></div>
      <button class="primary" id="btn" data-i18n="pay" style="width:100%;justify-content:center;margin-top:16px;padding:13px">Перейти до оплати</button>
      <div class="paynote" id="paynote" hidden>
        <span data-i18n="payHintA">Якщо ви не хочете автоматично переходити в застосунок Monobank, натисніть і утримуйте</span>
        <a id="paylink" target="_blank" rel="noopener" data-i18n="payHintLink">це ПОСИЛАННЯ</a><span data-i18n="payHintB">, а потім виберіть «Відкрити в новій вкладці браузера».</span>
      </div>
      <div class="status err" id="err" style="min-height:18px"></div>
    </div>
  </div>
  <div class="credits" id="credits"></div>
</div>
<script src="/i18n.js"></script>
<script>
window.I18N_DEFAULT = 'ua';
window.I18N = {
  en: { amount: 'Amount, ₴', name: 'Name', message: 'Message', youtube: 'YouTube link (optional)', voice: 'Voice', pay: 'Go to payment', ytFrom: 'The YouTube video plays from %p% ₴.', namePh: 'e.g. Ivan', msgPh: 'e.g. Hello everyone!', payWait: 'One moment…', payErr: 'Could not connect. Try again.', jar: 'Jar', bit: 'Sound alert', blankBit: 'Regular donation', thirdParty: 'No alerts from this jar \u2014 3rd-party jar' },
  ua: { amount: 'Сума, ₴', name: "Ім'я", message: 'Повідомлення', youtube: "Посилання на YouTube (необов'язково)", voice: 'Голос', pay: 'Перейти до оплати', ytFrom: 'YouTube-відео зіграє від %p% ₴.', namePh: 'Напр. Іван', msgPh: 'Напр. Привіт усім!', payWait: 'Хвилинку…', payErr: 'Не вдалося з\'єднатися. Спробуй ще раз.', jar: 'Банка', bit: 'Звукове сповіщення', blankBit: 'Звичайний донат', thirdParty: 'Без сповіщень \u2014 стороння банка' }
};
Object.assign(window.I18N.en, { noJar: 'No jar configured - add one in Settings' });
Object.assign(window.I18N.ua, { noJar: 'Банку не додано - додай її в Налаштуваннях' });
Object.assign(window.I18N.en, { payHintA: "If you don't want to open the Monobank app automatically, press and hold", payHintLink: 'this LINK', payHintB: ', then choose “Open in a new browser tab”.' });
Object.assign(window.I18N.ua, { payHintA: 'Якщо ви не хочете автоматично переходити в застосунок Monobank, натисніть і утримуйте', payHintLink: 'це ПОСИЛАННЯ', payHintB: ', а потім виберіть «Відкрити в новій вкладці браузера».' });
const $ = id => document.getElementById(id);
const err = m => { $('err').textContent = m || ''; };
const btn = $('btn');
const paynote = $('paynote'), paylink = $('paylink');
let YT_MIN = 0, BITS = [], JARS = [];
Promise.all([
  fetch('/api/state').then(r => r.json()).catch(() => ({})),
  fetch('/api/notify').then(r => r.json()).catch(() => ({})),
  fetch('/api/bits').then(r => r.json()).catch(() => ({}))
]).then(([s, n, b]) => {
  if (s.nickname) { $('brand').textContent = s.nickname; document.title = s.nickname; }
  const a = $('amount'); a.min = s.minAmount; a.max = s.maxAmount; a.placeholder = `від ${s.minAmount} до ${s.maxAmount}`;
  // jar picker (only when more than one jar is configured)
  JARS = s.jars || [];
  if (!JARS.length) {
    btn.disabled = true; btn.style.opacity = .45;
    err(window.t('noJar') || 'No jar configured - add one in Settings');
  }
  JARS.forEach(j => { const o = document.createElement('option'); o.value = j.code; o.textContent = j.title || j.code; $('jar').append(o); });
  if (JARS.length <= 1) $('row_jar').style.display = 'none';
  $('jar').addEventListener('change', applyJar); applyJar();
  // bits picker
  BITS = (b && b.bits) || [];
  const bs = $('bit');
  const none = document.createElement('option'); none.value = ''; none.textContent = window.t('blankBit'); bs.append(none);
  BITS.forEach(bit => { const o = document.createElement('option'); o.value = bit.code; o.textContent = (bit.label || bit.kind) + ' — ' + Math.round(bit.price) + ' ₴'; bs.append(o); });
  bs.addEventListener('change', applyBit);
  const d = (n.rules || []).find(r => r.id === 'default'); YT_MIN = (d && d.style && d.style.yt_min) || 0;
  const tts = s.tts || {};
  const vsel = $('voice'); const vrow = vsel.closest('.row');
  const voices = (s.voices || []).filter(v => !tts.allowed || tts.allowed.includes(v.id));
  voices.forEach(v => { const o = document.createElement('option'); o.value = v.id; o.textContent = v.label; vsel.append(o); });
  if (tts.voice) vsel.value = tts.voice;
  if (vrow && !tts.picks) vrow.style.display = 'none';
  $('hint').textContent = window.t('ytFrom').replace('%p%', YT_MIN);
  window.mountLangSeg($('langseg')); window.applyI18n();
});
function applyJar() {
  const el = $('jarThNote'); if (!el) return;
  const j = JARS.find(x => x.code === $('jar').value);
  if (j && j.mine === false) { el.textContent = window.t('thirdParty'); el.style.display = ''; }
  else el.style.display = 'none';
}
window.applyLang = function () { $('hint').textContent = window.t('ytFrom').replace('%p%', YT_MIN);
  const b0 = $('bit') && $('bit').options[0]; if (b0) b0.textContent = window.t('blankBit'); renderCredits(); };
function applyBit() {
  const bit = BITS.find(x => x.code === $('bit').value);
  ['amount', 'name', 'message'].forEach(id => {
    const el = $(id); el.disabled = !!bit; const r = el.closest('.row'); if (r) r.style.opacity = bit ? .45 : 1;
  });
  const ytOk = !bit || Number(bit.price) >= YT_MIN;
  const y = $('youtube'); y.disabled = !ytOk; const yr = y.closest('.row'); if (yr) yr.style.opacity = ytOk ? 1 : .45;
  if (bit) $('amount').value = bit.price;
}
btn.addEventListener('click', async e => {
  e.preventDefault(); err(''); btn.disabled = true; btn.textContent = window.t('payWait');
  paynote.hidden = true; paylink.removeAttribute('href');
  try { const bit = BITS.find(x => x.code === $('bit').value);
    const body = { jar: $('jar').value, youtube: $('youtube').value, voice: $('voice').value };
    if (bit) body.bit = bit; else { body.amount = Number($('amount').value); body.name = $('name').value; body.message = $('message').value; }
    const r = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.ok) { err(d.error || 'Error'); btn.disabled = false; btn.textContent = window.t('pay'); return; }
    paylink.href = d.redirect; paynote.hidden = false;
    window.open(d.redirect, '_blank', 'noopener');
    $('amount').value = ''; $('name').value = ''; $('message').value = ''; $('youtube').value = '';
    btn.disabled = false; btn.textContent = window.t('pay');
  } catch { err(window.t('payErr')); btn.disabled = false; btn.textContent = window.t('pay'); }
});
fetch('/api/config').then(r => r.json()).then(c => {
  if (c && c.bg) {
    document.body.style.backgroundImage = 'url("' + c.bg + '")';
    const card = document.querySelector('.panel');
    if (card) card.style.background = 'color-mix(in srgb,var(--card) 95%,transparent)';
  }
}).catch(() => {});

function renderCredits() {
  const el = document.getElementById('credits'); if (!el) return;
  const ua = window.getLang && window.getLang() === 'ua';
  el.innerHTML = ua
    ? 'Нічого тут не зроблено by <b>terriblefeelings</b> — код написали моделі opencode. Оригінальний код таймера марафону — <a href="https://github.com/stalexteam" target="_blank" rel="noopener">stalexteam</a>, перероблено моделями opencode.'
    : 'Nothing here was made by <b>terriblefeelings</b> — the code was written by opencode models. The marathon timer\'s original code is by <a href="https://github.com/stalexteam" target="_blank" rel="noopener">stalexteam</a>, remade by opencode models.';
}
renderCredits();
</script>
</body>
</html>
