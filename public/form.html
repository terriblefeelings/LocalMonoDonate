<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Підтримати</title>
<link rel="stylesheet" href="/app.css">
<style>
  body{background-size:100% 100%;background-position:center;background-attachment:scroll;background-repeat:no-repeat;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  body:not(.notify-page):not(.hasbg){background-image:none;background-size:100% 100%;background-position:center;background-attachment:scroll;background-repeat:no-repeat;background-color:var(--bg)}
  @media(max-width:640px){body{padding:12px}}
  .wrap{max-width:560px;width:100%}
  .row .ctl{max-width:none}
  #hint{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.credits{position:static;margin:18px auto 0;max-width:560px;padding:0 16px;text-align:center;font-size:11px;line-height:1.55;color:var(--muted);opacity:.8;pointer-events:auto}
.paynote{margin:10px 0 0;text-align:left;font-size:12.5px;line-height:1.55;color:var(--muted)}
.paynote a{font-weight:700;color:var(--fg);text-decoration:underline}
.paynote[hidden]{display:none}
  .payhint{margin-top:6px;font-size:11.5px;line-height:1.5;color:var(--muted);text-align:left}
.pick{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card2);color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;text-align:center;line-height:1.25}
.pick:hover{border-color:var(--faint);color:var(--fg)}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* the page-wide button rule outranks .pick.on, so the selected alert uses the id */
#bitsGrid .pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#bitsGrid{display:grid;gap:8px}
#bitsGrid .pick{flex-direction:column;gap:1px;min-height:48px;padding:6px 8px;line-height:1.15}
#bitsGrid .pick-label{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;text-align:center}
#bitsGrid .pick-price{display:block;width:100%;font-size:11px;font-weight:500;opacity:.7;text-align:center;white-space:nowrap}
body .panel .body>#row_bits_total[hidden]{display:none}
#bits_total:disabled{opacity:.55;cursor:not-allowed}
body .panel .body>#row_bits_pick[hidden]{display:none}
body .panel .body>#row_bits_pick:not([hidden]){display:flex;flex-direction:column;align-items:stretch;gap:8px}
body .panel .body>#row_bits_pick .ctl{max-width:none}
body.hasbg .note{background:rgba(0,0,0,.46);border-radius:4px;padding:5px 8px}
body.hasbg .credits{background:rgba(0,0,0,.95);border-radius:4px;padding:8px 12px}
.credits a{color:inherit;text-decoration:underline}
.credits b{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="sec"><span class="h" id="brand">Підтримати стрім</span><span class="sp"></span><span class="seg" id="langseg"></span></div>
    <div class="body">
      <div class="row" id="row_jar"><label data-i18n="jar">Банка</label><div class="ctl"><select id="jar"></select><div class="note" id="jarThNote" style="display:none"></div></div></div>
      <div class="row" id="row_bit"><label data-i18n="bit">Режим звукових сповіщень</label><div class="ctl"><select id="bit"></select></div></div>
      <div class="row" id="row_bits_pick" hidden><label data-i18n="bitsLabel">Звукові сповіщення</label><div class="ctl">
        <div id="bitsGrid"></div>
        <div class="note" id="bitsOrderLine" style="display:none;margin-top:8px"></div>
      </div></div>
      <div class="row"><label data-i18n="amount">Сума, ₴</label><div class="ctl"><input id="amount" type="number" inputmode="numeric" step="1" autocomplete="off" required></div></div>
      <div class="row" id="row_bits_total" hidden><label data-i18n="bitsTotal">Звукові сповіщення, ₴</label><div class="ctl"><input id="bits_total" type="number" disabled value="0"></div></div>
      <div class="row"><label data-i18n="name">Ім'я</label><div class="ctl"><input id="name" type="text" maxlength="40" autocomplete="off" data-i18n-ph="namePh" placeholder="Напр. Alien"></div></div>
      <div class="row"><label data-i18n="message">Повідомлення</label><div class="ctl"><textarea id="message" maxlength="500" autocomplete="off" data-i18n-ph="msgPh" placeholder="Напр. Привіт усім!" style="min-height:84px;resize:vertical"></textarea></div></div>
      <div class="row"><label data-i18n="youtube">Media link (optional)</label><div class="ctl"><input id="youtube" type="text" autocomplete="off" placeholder="youtu.be / instagram.com / tiktok.com / twitch.tv / v.redd.it / x.com"></div></div>
      <div class="row"><label data-i18n="voice">Голос</label><div class="ctl"><select id="voice"></select></div></div>
      <div class="note" id="hint"></div>
      <button class="primary" id="btn" data-i18n="pay" style="width:100%;justify-content:center;margin-top:16px;padding:13px">Згенерувати лінк</button>
      <div class="payopts" id="payopts" hidden>
        <div class="paynote" style="display:flex;flex-direction:column;gap:8px;align-items:stretch">
          <span data-i18n="payDirect">Перейти до оплати напряму до Монобанки пана стрімера</span>
          <a class="btn" id="paylink" target="_blank" rel="noopener" data-i18n="payGo" style="display:flex;width:100%;justify-content:center">Перейти</a>
          <span class="payhint" data-i18n="payNote">Примітка: якщо не хочете, щоб застосунок Monobank відкривався автоматично, натисніть і утримуйте кнопку «Перейти» і виберіть «Відкрити в новій вкладці браузера» або, за потреби, «Копіювати посилання».</span>
        </div>
      </div>
      <div class="status err" id="err" style="min-height:18px"></div>
    </div>
  </div>
  <div class="credits" id="credits"></div>
</div>
<script src="/i18n.js"></script>
<script>
window.I18N_DEFAULT = 'ua';
window.I18N = {
  en: { amount: 'Amount, ₴', name: 'Name', message: 'Message', youtube: 'YouTube link (optional)', voice: 'Voice', pay: 'Generate link', payDirect: 'Pay directly in the streamer\'s Monobank', payGo: 'Open', payNote: "Note: If you do not want the Monobank app to open automatically, long press the Open button and choose either Open in new browser tab or, if you want to do it manually, Copy link.", ytFrom: 'The YouTube video plays from %p% ₴.', namePh: 'e.g. Alien', msgPh: 'e.g. Hello everyone!', payWait: 'One moment…', payErr: 'Could not connect. Try again.', jar: 'Jar', bit: 'Sound Alerts Mode', blankBit: 'Regular Donation', thirdParty: 'No alerts from this jar \u2014 3rd-party jar' },
  ua: { amount: 'Сума, ₴', name: "Ім'я", message: 'Повідомлення', youtube: "Посилання на YouTube (необов'язково)", voice: 'Голос', pay: 'Згенерувати лінк', payDirect: 'Перейти до оплати напряму до Монобанки пана стрімера', payGo: 'Перейти', payNote: 'Примітка: якщо не хочете, щоб застосунок Monobank відкривався автоматично, натисніть і утримуйте кнопку «Перейти» і виберіть «Відкрити в новій вкладці браузера» або, за потреби, «Копіювати посилання».', ytFrom: 'YouTube-відео зіграє від %p% ₴.', namePh: 'Напр. Alien', msgPh: 'Напр. Привіт усім!', payWait: 'Хвилинку…', payErr: 'Не вдалося з\'єднатися. Спробуй ще раз.', jar: 'Банка', bit: 'Режим звукових сповіщень', blankBit: 'Звичайний донат', thirdParty: 'Без сповіщень \u2014 стороння банка' }
};
Object.assign(window.I18N.en, { noJar: 'No jar configured - add one in Settings' });
Object.assign(window.I18N.ua, { noJar: 'Банку не додано - додай її в Налаштуваннях' });
Object.assign(window.I18N.en, { mediaFrom: 'YouTube from %y% \u20b4; Instagram, TikTok, Twitch, Reddit and X from %o% \u20b4.', mediaYtFrom: 'YouTube from %p% \u20b4', mediaOtherFrom: 'from %p% \u20b4', mediaNone: 'Media links are disabled.', youtube: 'Media link (optional)' });
Object.assign(window.I18N.ua, { mediaFrom: 'YouTube \u0432\u0456\u0434 %y% \u20b4; Instagram, TikTok, Twitch, Reddit \u0456 X \u2014 \u0432\u0456\u0434 %o% \u20b4.', mediaYtFrom: 'YouTube \u0432\u0456\u0434 %p% \u20b4', mediaOtherFrom: '\u2014 \u0432\u0456\u0434 %p% \u20b4', mediaNone: '\u041c\u0435\u0434\u0456\u0430\u043f\u043e\u0441\u0438\u043b\u0430\u043d\u043d\u044f \u0432\u0438\u043c\u043a\u043d\u0435\u043d\u043e.', youtube: '\u041f\u043e\u0441\u0438\u043b\u0430\u043d\u043d\u044f \u043d\u0430 \u043c\u0435\u0434\u0456\u0430 (\u043d\u0435\u043e\u0431\u043e\u0432\u02bc\u044f\u0437\u043a\u043e\u0432\u0435)' });
Object.assign(window.I18N.en, { bitsLabel: 'Sound Alerts', bitsLabelOrder: 'Sound Alerts Order', bitsLabelAdhd: 'Sound Alerts ADHD', bitsTotal: 'Sound Alerts, ₴', bitsOrderLine: 'Playback order: %list%', bitsPicked: 'Selected alerts: %list%' });
Object.assign(window.I18N.ua, { bitsLabel: '\u0417\u0432\u0443\u043a\u043e\u0432\u0456 \u0441\u043f\u043e\u0432\u0456\u0449\u0435\u043d\u043d\u044f', bitsLabelOrder: '\u0417\u0432\u0443\u043a\u043e\u0432\u0456 \u0441\u043f\u043e\u0432\u0456\u0449\u0435\u043d\u043d\u044f: \u043f\u043e \u0447\u0435\u0440\u0437\u0456', bitsLabelAdhd: '\u0417\u0432\u0443\u043a\u043e\u0432\u0456 \u0441\u043f\u043e\u0432\u0456\u0449\u0435\u043d\u043d\u044f: ADHD', bitsTotal: '\u0417\u0432\u0443\u043a\u043e\u0432\u0456 \u0441\u043f\u043e\u0432\u0456\u0449\u0435\u043d\u043d\u044f, \u20b4', bitsOrderLine: '\u041f\u043e\u0440\u044f\u0434\u043e\u043a \u0432\u0456\u0434\u0442\u0432\u043e\u0440\u0435\u043d\u043d\u044f: %list%', bitsPicked: '\u041e\u0431\u0440\u0430\u043d\u0456 \u0441\u043f\u043e\u0432\u0456\u0449\u0435\u043d\u043d\u044f: %list%' });
const $ = id => document.getElementById(id);
const err = m => { $('err').textContent = m || ''; };
const btn = $('btn');
const payopts = $('payopts'), paylink = $('paylink');
let YT_MIN = 0, OTHER_MIN = 0, BITS = [], JARS = [];
let MODES = [], MODE = '', SELECTED = [], GRID = 3;
// a reload is a fresh donation: don't restore the previous donor's fields
try { localStorage.removeItem('lmd:nick'); } catch (e) {}
['amount', 'name', 'message', 'youtube'].forEach(id => { const el = $(id); if (el) el.value = ''; });
window.addEventListener('pageshow', () => {
  ['amount', 'name', 'message', 'youtube'].forEach(id => { const el = $(id); if (el) el.value = ''; });
});
let MEDIA = { youtube: true, instagram: true, tiktok: true, twitch: true, reddit: true, x: true };
const MEDIA_NAMES = { instagram: 'Instagram', tiktok: 'TikTok', twitch: 'Twitch', reddit: 'Reddit', x: 'X' };
const MEDIA_PLACEHOLDERS = { youtube: 'youtu.be', instagram: 'instagram.com', tiktok: 'tiktok.com', twitch: 'twitch.tv', reddit: 'v.redd.it', x: 'x.com' };
function mediaOn(id) { return MEDIA[id] !== false; }
function joinMediaNames(names) {
  const and = window.getLang() === 'ua' ? ' і ' : ' and ';
  if (!names.length) return '';
  if (names.length === 1) return names[0];
  return names.slice(0, -1).join(', ') + and + names[names.length - 1];
}
function enabledOtherMedia() { return ['instagram', 'tiktok', 'twitch', 'reddit', 'x'].filter(mediaOn); }
function updateMediaHint() {
  const parts = [];
  if (mediaOn('youtube')) parts.push(window.t('mediaYtFrom').replace('%p%', YT_MIN));
  const others = enabledOtherMedia();
  if (others.length) parts.push(joinMediaNames(others.map(id => MEDIA_NAMES[id])) + ' ' + window.t('mediaOtherFrom').replace('%p%', OTHER_MIN));
  $('hint').textContent = parts.length ? parts.join('; ') : window.t('mediaNone');
  const ph = Object.keys(MEDIA_PLACEHOLDERS).filter(mediaOn).map(id => MEDIA_PLACEHOLDERS[id]);
  $('youtube').placeholder = ph.length ? ph.join(' / ') : '';
}
window.setMediaConfig = function (cfg) {
  if (!cfg) return;
  ['youtube', 'instagram', 'tiktok', 'twitch', 'reddit', 'x'].forEach(id => { MEDIA[id] = cfg[id] !== false; });
  if (cfg.ytMin != null) YT_MIN = Number(cfg.ytMin) || 0;
  if (cfg.otherMin != null) OTHER_MIN = Number(cfg.otherMin) || 0;
  updateMediaHint();
  applyBit();
};
Promise.all([
  fetch('/api/state').then(r => r.json()).catch(() => ({})),
  fetch('/api/notify').then(r => r.json()).catch(() => ({})),
  fetch('/api/bits').then(r => r.json()).catch(() => ({}))
]).then(([s, n, b]) => {
  if (s.nickname) { $('brand').textContent = s.nickname; document.title = s.nickname; }
  const a = $('amount'); a.min = s.minAmount; a.max = s.maxAmount; a.placeholder = `від ${s.minAmount} до ${s.maxAmount}`;
  // jar picker (only when more than one jar is configured)
  JARS = s.jars || [];
  if (!JARS.length) {
    btn.disabled = true; btn.style.opacity = .45;
    err(window.t('noJar') || 'No jar configured - add one in Settings');
  }
  JARS.forEach(j => { const o = document.createElement('option'); o.value = j.code; o.textContent = j.title || j.code; $('jar').append(o); });
  if (JARS.length <= 1) $('row_jar').style.display = 'none';
  $('jar').addEventListener('change', applyJar); applyJar();
  // bits picker: the configured selectors become options (Regular Donation first)
  BITS = ((b && b.bits) || []).slice().sort((a, b) => (Number(a.slot) || 0) - (Number(b.slot) || 0));
  const list = Array.isArray(b && b.modes) ? b.modes : (['single', 'order', 'adhd'].includes(b && b.mode) ? [b.mode] : ['single']);
  MODES = ['order', 'adhd', 'single'].filter(m => list.includes(m));
  GRID = Number(b && b.grid) || 3;
  fillBitOptions();
  const bs = $('bit');
  bs.addEventListener('change', () => {
    payopts.hidden = true;
    MODE = bs.value;
    if (!MODE) SELECTED = [];
    if (MODE === 'single' && SELECTED.length > 1) SELECTED = [SELECTED[SELECTED.length - 1]];
    syncBitsGrid(); applyBit();
  });
  if (MODES.length) renderBitsGrid();
  const d = (n.rules || []).find(r => r.id === 'default'); const st = (d && d.style) || {};
  YT_MIN = st.yt_min || 0; OTHER_MIN = st.other_media_min || 0;
  ['youtube', 'instagram', 'tiktok', 'twitch', 'reddit', 'x'].forEach(id => { MEDIA[id] = st['media_' + id] !== false; });
  const tts = s.tts || {};
  const vsel = $('voice'); const vrow = vsel.closest('.row');
  const voices = (s.voices || []).filter(v => !tts.allowed || tts.allowed.includes(v.id));
  voices.forEach(v => { const o = document.createElement('option'); o.value = v.id; o.textContent = v.label; vsel.append(o); });
  if (tts.voice) vsel.value = tts.voice;
  if (vrow && !tts.picks) vrow.style.display = 'none';
  updateMediaHint(); applyBit();
  window.mountLangSeg($('langseg')); window.applyI18n();
});
function applyJar() {
  const el = $('jarThNote'); if (!el) return;
  const j = JARS.find(x => x.code === $('jar').value);
  if (j && j.mine === false) { el.textContent = window.t('thirdParty'); el.style.display = ''; }
  else el.style.display = 'none';
}
window.applyLang = function () { updateMediaHint();
  fillBitOptions();
  syncBitsGrid(); renderCredits(); };
function fillBitOptions() {
  const bs = $('bit');
  const keep = bs.value;
  bs.innerHTML = '';
  const add = (v, text) => { const o = document.createElement('option'); o.value = v; o.textContent = text; bs.append(o); };
  add('', window.t('blankBit'));
  // the extra selectors sit between Regular Donation and the normal Sound Alerts
  const keys = { order: 'bitsLabelOrder', adhd: 'bitsLabelAdhd', single: 'bitsLabel' };
  ['order', 'adhd', 'single'].forEach(m => { if (MODES.includes(m)) add(m, window.t(keys[m])); });
  bs.value = keep === '' || MODES.includes(keep) ? keep : '';
  MODE = bs.value;
}
function renderBitsGrid() {
  const g = $('bitsGrid'); if (!g) return; g.innerHTML = '';
  const cols = Math.max(1, Math.min(GRID, BITS.length || 1));
  g.style.gridTemplateColumns = 'repeat(' + cols + ',minmax(0,1fr))';
  BITS.forEach(bit => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pick'; b.dataset.code = bit.code;
    const label = bit.label || bit.kind;
    const lab = document.createElement('span'); lab.className = 'pick-label'; lab.textContent = label;
    const price = document.createElement('span'); price.className = 'pick-price';
    price.textContent = Math.round(Number(bit.price) || 0) + ' ₴';
    b.title = label;
    b.append(lab, price);
    b.addEventListener('click', () => toggleBit(bit.code));
    g.append(b);
  });
  syncBitsGrid();
}
function toggleBit(code) {
  if (MODE === 'single') {
    SELECTED = SELECTED[0] === code ? [] : [code];
  } else {
    const i = SELECTED.indexOf(code);
    if (i >= 0) SELECTED.splice(i, 1); else SELECTED.push(code);
  }
  payopts.hidden = true; syncBitsGrid(); applyBit();
}
function syncBitsGrid() {
  const on = MODE !== '';
  $('row_bits_pick').hidden = !on;
  document.querySelectorAll('#bitsGrid .pick').forEach(b => {
    const picked = SELECTED.includes(b.dataset.code);
    b.classList.toggle('on', picked);
    b.setAttribute('aria-pressed', String(picked));
  });
  const line = $('bitsOrderLine'); if (!line) return;
  if (!on || MODE === 'single' || !SELECTED.length) { line.style.display = 'none'; return; }
  const names = SELECTED.map(c => (BITS.find(x => x.code === c) || {}).label || c);
  const list = names.join(MODE === 'adhd' ? ', ' : ' → ');
  line.textContent = window.t(MODE === 'adhd' ? 'bitsPicked' : 'bitsOrderLine').replace('%list%', list);
  line.style.display = '';
}
function chosenBits() {
  if (!MODE) return [];
  return SELECTED.map(c => BITS.find(x => x.code === c)).filter(Boolean);
}
function applyBit() {
  const bits = chosenBits();
  const extra = bits.reduce((s, b) => s + (Number(b.price) || 0), 0);
  ['amount', 'name', 'message'].forEach(id => {
    const el = $(id); el.disabled = false; const r = el.closest('.row'); if (r) r.style.opacity = 1;
  });
  // the alert total is its own read-only field; the regular amount stays the donor's input
  const btr = $('row_bits_total'), bt = $('bits_total');
  const showExtra = MODE !== '';
  if (btr) btr.hidden = !showExtra;
  if (bt) bt.value = String(extra);
  const base = Number($('amount').value) || 0;
  // media limits are about the donation itself, never the sound-alert total
  const ytOk = mediaOn('youtube') && base >= YT_MIN;
  const mediaOk = ytOk || enabledOtherMedia().length > 0;
  const y = $('youtube'); y.disabled = !mediaOk; const yr = y.closest('.row'); if (yr) yr.style.opacity = mediaOk ? 1 : .45;
}
btn.addEventListener('click', async e => {
  e.preventDefault(); err(''); btn.disabled = true; btn.textContent = window.t('payWait');
  payopts.hidden = true; paylink.removeAttribute('href');
  try { const bits = chosenBits();
    const body = { jar: $('jar').value, youtube: $('youtube').value, voice: $('voice').value };
    const extra = bits.reduce((s, b) => s + (Number(b.price) || 0), 0);
    body.amount = (Number($('amount').value) || 0) + extra;
    body.name = $('name').value; body.message = $('message').value;
    if (bits.length) { body.bits = bits; body.mode = MODE; }
    const r = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.ok) { err(d.error || 'Error'); btn.disabled = false; btn.textContent = window.t('pay'); return; }
    paylink.href = d.fallback || d.redirect; payopts.hidden = false;
    btn.disabled = false; btn.textContent = window.t('pay');
  } catch { err(window.t('payErr')); btn.disabled = false; btn.textContent = window.t('pay'); }
});
['amount', 'name', 'message', 'youtube', 'bit', 'jar', 'voice'].forEach(id => {
  const el = $(id);
  if (!el) return;
  el.addEventListener('input', () => { payopts.hidden = true; paylink.removeAttribute('href'); if (id === 'amount') applyBit(); });
  el.addEventListener('change', () => { payopts.hidden = true; paylink.removeAttribute('href'); });
});
fetch('/api/config').then(r => r.json()).then(c => {
  if (c && c.bg) {
    document.body.classList.toggle('hasbg', !!c.bg);
    if (c.bg) document.body.style.backgroundImage = 'url("' + c.bg + '")';
    const card = document.querySelector('.panel');
    if (card) card.style.background = 'color-mix(in srgb,var(--card) 95%,transparent)';
  }
}).catch(() => {});

function renderCredits() {
  const el = document.getElementById('credits'); if (!el) return;
  const ua = window.getLang && window.getLang() === 'ua';
  el.innerHTML = ua
    ? 'Нічого тут не зроблено by <b>terriblefeelings</b> — код написали моделі opencode. Оригінальний код таймера марафону — <a href="https://github.com/stalexteam" target="_blank" rel="noopener">stalexteam</a>, перероблено моделями opencode.'
    : 'Nothing here was made by <b>terriblefeelings</b> — the code was written by opencode models. The marathon timer\'s original code is by <a href="https://github.com/stalexteam" target="_blank" rel="noopener">stalexteam</a>, remade by opencode models.';
}
renderCredits();
</script>
</body>
</html>
