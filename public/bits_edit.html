<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bits — LocalMonoDonate</title>
<link rel="stylesheet" href="/app.css">
<style>
  body{display:flex;flex-direction:column;min-height:100vh}
  .wrap{margin:auto;width:100%}
  .bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 10px;max-width:620px;margin:0 auto}
  .bcell{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;color:var(--fg);font:inherit}
  .bcell .sq{width:100%;aspect-ratio:1/1;border:1px solid var(--line);background:color-mix(in srgb,var(--card2) calc(var(--deck-alpha,1) * 100%),transparent);border-radius:var(--r-sm);
    display:flex;align-items:center;justify-content:center;font-size:18px;background-size:cover;background-position:center;background-repeat:no-repeat;overflow:hidden;transition:.12s}
  .bcell:hover .sq{border-color:var(--faint)}
  .bcell.sel .sq{border-color:var(--accent)}
  .bcell .l{font-size:11px;font-weight:600;line-height:1.15;word-break:break-word;text-align:center}
  .bcell .p{font-size:10px;color:var(--fg);text-align:center}
  .bcell.empty .sq{border-style:dashed;opacity:.4}
  .bcell{position:relative}
  .pvbtn{position:absolute;top:6px;right:6px;width:26px!important;min-width:26px!important;height:26px!important;min-height:26px!important;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.6);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:.12s;padding:0!important;z-index:2}
  .bcell:hover .pvbtn{opacity:1}
  .bitpv{width:100%;max-width:360px;height:150px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--card2)}
  .bitpv img{height:100%;width:auto;max-width:none;display:block}
  .bitpv video{height:100%;max-width:100%;width:auto;object-fit:contain;display:block}
  .bitpv .ph{font-size:12px;color:var(--faint);padding:0 8px;text-align:center}
  #deck{background-size:100% 100%;background-position:center;background-repeat:no-repeat;border-radius:var(--r-sm)}
  #win{max-width:660px;margin:0 auto;background-color:color-mix(in srgb,var(--card) calc(var(--win-alpha,1) * 100%),transparent);background-size:100% 100%;background-position:center;background-repeat:no-repeat}
  .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
  .modes .modebtn{width:100%;min-height:34px;padding:0 12px}
  #modes .modebtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div class="head" id="siteHeader"></div>


<div class="wrap">
  <div class="status" id="status"></div>
  <div class="panel" id="win">
    <div class="sec"><span class="h" data-i18n="deck">Sound Alerts Deck</span><span class="sp"></span><span id="gridbtns" style="display:inline-flex;gap:6px"></span><span id="bgbtns"></span></div>
    <div class="body">
      <div class="modes" id="modes">
        <button type="button" class="modebtn" data-mode="single" data-i18n="modeSingle">Single</button>
        <button type="button" class="modebtn" data-mode="order" data-i18n="modeOrder">In Order</button>
        <button type="button" class="modebtn" data-mode="adhd" data-i18n="modeAdhd">ADHD</button>
      </div>
      <div class="bgrid" id="deck"></div>
    </div>
  </div>

  <div class="panel" id="editor" style="display:none">
    <div class="sec"><span class="n">02</span><span class="h" id="edtitle" data-i18n="bit">Bit</span></div>
    <div class="body">
      <div class="row"><label data-i18n="label">Label</label><div class="ctl"><div style="display:flex;gap:6px"><input id="b_label" placeholder="e.g. Airhorn"><button id="b_test" class="testbtn" title="Test this bit">TEST</button></div></div></div>
      <div class="row"><label data-i18n="buttonImage">Button image</label><div class="ctl"><div style="display:flex;gap:6px"><input id="b_img" placeholder="/media/… or https://…"><button id="b_imgup">↑</button></div></div></div>
      <div class="row"><label data-i18n="kind">Type</label><div class="ctl"><select id="b_kind"><option value="sound" data-i18n="optSound">Sound</option><option value="video" data-i18n="optVideo">Video</option><option value="image" data-i18n="optImage">Image</option><option value="alert" data-i18n="optAlert">Alert (existing)</option></select></div></div>
      <div class="row" id="row_media"><label data-i18n="media">Media (mp3/mp4…)</label><div class="ctl"><div style="display:flex;gap:6px"><input id="b_url" placeholder="/media/… or https://…"><button id="b_up">↑</button></div></div></div>
      <div class="row" id="row_sound"><label data-i18n="sound">Sound (with image)</label><div class="ctl"><div style="display:flex;gap:6px"><input id="b_sound" placeholder="/media/… or https://…"><button id="b_soundup">↑</button></div></div></div>
      <div class="row" id="row_preview"><label data-i18n="preview">Preview</label><div class="ctl"><div class="bitpreview"><div id="b_preview" class="bitpv"></div><div class="bitplayer"><button id="pvBtn" type="button" class="ib" title="Play/Pause" aria-label="Play/Pause">▶</button><input type="range" id="b_vol" min="0" max="1" step="0.01" value="0.5" title="Volume"><span class="bitplayer__time" id="pvTime">0:00 / 0:00</span></div></div></div></div>
      <div class="row" id="row_alert"><label data-i18n="alert">Alert</label><div class="ctl"><select id="b_rule"></select></div></div>
      <div class="row"><label data-i18n="price">Price (₴)</label><div class="ctl"><input id="b_price" type="number" min="0" step="1" placeholder="100"></div></div>
      <div style="display:flex;gap:8px;margin-top:12px"><button id="b_del" data-i18n="remove">Remove</button><button class="primary" id="b_apply" data-i18n="apply">Apply</button></div>
      <div class="note" id="b_code"></div>
    </div>
  </div>
</div>

<input type="file" id="file" style="display:none">
<input type="file" id="imgfile" style="display:none">
<input type="file" id="soundfile" style="display:none">
<script src="/i18n.js"></script>
<script src="/head.js"></script>
<script>
window.HEAD_THEMES = ['dark', 'light'];
window.I18N = {
  en: { deck: 'Sound Alerts Deck', clickEdit: 'Click a cell to edit.', bit: 'Sound Alert', newBit: 'New Sound Alert', label: 'Label', buttonImage: 'Button image', kind: 'Type', optSound: 'Sound', optVideo: 'Video', optImage: 'Image', optAlert: 'Alert (existing)', media: 'Media', sound: 'Sound (with image)', alert: 'Alert', price: 'Price (₴)', remove: 'Remove', apply: 'Apply', preview: 'Preview', vol: 'Volume', codeOnSave: 'A code is generated on save.' },
  ua: { deck: 'Дек звукових сповіщень', clickEdit: 'Натисніть клітинку, щоб редагувати.', bit: 'Звукове сповіщення', newBit: 'Нове звукове сповіщення', label: 'Назва', buttonImage: 'Зображення кнопки', kind: 'Тип', optSound: 'Звук', optVideo: 'Відео', optImage: 'Зображення', optAlert: 'Сповіщення (наявне)', media: 'Медіа', sound: 'Звук (із зображенням)', alert: 'Сповіщення', price: 'Ціна (₴)', remove: 'Видалити', apply: 'Застосувати', preview: 'Перегляд', vol: 'Гучність', codeOnSave: 'Код згенерується при збереженні.' }
};
Object.assign(window.I18N.en, { modeSingle: 'Single', modeOrder: 'In Order', modeAdhd: 'ADHD', applied: 'Applied. Press Save to store.', removed: 'Removed. Press Save to store.', saved: 'Saved', saveError: 'Save error' });
Object.assign(window.I18N.ua, { modeSingle: 'Одне', modeOrder: 'По черзі', modeAdhd: 'ADHD', applied: 'Застосовано. Натисніть «Зберегти», щоб записати зміни.', removed: 'Видалено. Натисніть «Зберегти», щоб записати зміни.', saved: 'Збережено', saveError: 'Помилка збереження' });
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const icon = k => k === 'video' ? '🎬' : k === 'image' ? '🖼️' : k === 'sound' ? '🔊' : '✨';
const isVidUrl = u => /\.(mp4|webm|mov|mkv|avi|m4v)(\?|$)/i.test(u || '');
let BITS = [], RULES = [], selSlot = -1, GRID = 5, MODES_ON = ['single'];
function buildGridButtons() {
  const box = $('gridbtns'); box.innerHTML = '';
  for (let n = 2; n <= 7; n++) {
    const b = document.createElement('button'); b.className = 'ib'; b.textContent = n + '×' + n; b.title = n + '×' + n;
    b.classList.toggle('on', n === GRID);
    b.onclick = () => { GRID = n; if (selSlot >= GRID * GRID) { selSlot = -1; $('editor').style.display = 'none'; } buildGridButtons(); render(); };
    box.append(b);
  }
}

function syncModes() {
  document.querySelectorAll('.modebtn').forEach(b => {
    const on = MODES_ON.includes(b.dataset.mode);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
}
document.querySelectorAll('.modebtn').forEach(b => b.addEventListener('click', () => {
  const m = b.dataset.mode;
  MODES_ON = MODES_ON.includes(m) ? MODES_ON.filter(x => x !== m) : [...MODES_ON, m];
  syncModes(); status(window.t('applied'));
}));

function enhanceSelects() {
  document.querySelectorAll('select').forEach(s => {
    if (s._enh) return; s._enh = 1;
    const wrap = document.createElement('div'); wrap.className = 'selwrap';
    s.parentNode.insertBefore(wrap, s); wrap.appendChild(s);
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'selbtn';
    const pop = document.createElement('div'); pop.className = 'selpop'; wrap.append(btn, pop);
    s._syncLabel = () => { btn.textContent = (s.options[s.selectedIndex] || {}).textContent || ''; };
    const build = () => { pop.innerHTML = ''; Array.from(s.options).forEach((o, i) => { const it = document.createElement('div');
      it.className = 'selopt' + (i === s.selectedIndex ? ' on' : ''); it.textContent = o.textContent;
      it.onclick = e => { e.stopPropagation(); s.selectedIndex = i; s._syncLabel(); s.dispatchEvent(new Event('change', { bubbles: true })); wrap.classList.remove('open'); };
      pop.appendChild(it); }); };
    btn.onclick = e => { e.stopPropagation(); document.querySelectorAll('.selwrap.open').forEach(w => { if (w !== wrap) w.classList.remove('open'); }); build(); const open = wrap.classList.toggle('open');
      if (open) { const r = btn.getBoundingClientRect(); pop.style.position = 'fixed'; pop.style.left = r.left + 'px'; pop.style.width = r.width + 'px'; pop.style.right = 'auto';
        pop.style.top = (r.bottom + 4) + 'px'; pop.style.maxHeight = Math.max(120, window.innerHeight - r.bottom - 16) + 'px'; } };
    s._syncLabel();
  });
}
document.addEventListener('click', () => document.querySelectorAll('.selwrap.open').forEach(w => w.classList.remove('open')));

function render() {
  const g = $('deck'); g.innerHTML = ''; g.style.gridTemplateColumns = 'repeat(' + GRID + ',1fr)';
  for (let i = 0; i < GRID * GRID; i++) {
    const bit = BITS.find(x => Number(x.slot) === i);
    const c = document.createElement('div'); c.className = 'bcell' + (bit ? '' : ' empty') + (i === selSlot ? ' sel' : '');
    c.onclick = () => openEditor(i);
    const sq = document.createElement('div'); sq.className = 'sq';
    if (bit && bit.img) { sq.style.backgroundImage = 'url("' + bit.img + '")'; sq.style.backgroundSize = 'cover'; sq.style.backgroundPosition = 'center'; }
    else sq.textContent = bit ? icon(bit.kind) : '+';
    c.append(sq);
    if (bit) { const l = document.createElement('span'); l.className = 'l'; l.textContent = bit.label || bit.kind;
      const p = document.createElement('span'); p.className = 'p'; p.textContent = Math.round(bit.price || 0) + ' ₴'; c.append(l, p);
      const tb = document.createElement('button'); tb.type = 'button'; tb.className = 'pvbtn'; tb.title = 'Test'; tb.textContent = '▶';
      tb.onclick = e => { e.stopPropagation(); testBit(bit); }; c.append(tb); }
    g.append(c);
  }
}
function openEditor(slot) {
  selSlot = slot; render();
  const bit = BITS.find(x => Number(x.slot) === slot);
  $('editor').style.display = 'block';
  $('edtitle').textContent = (bit ? window.t('bit') : window.t('newBit')) + ' · ' + (slot + 1);
  $('b_label').value = bit ? (bit.label || '') : '';
  $('b_img').value = bit ? (bit.img || '') : '';
  $('b_kind').value = bit ? (bit.kind || 'sound') : 'sound';
  $('b_url').value = bit ? (bit.url || '') : '';
  $('b_rule').value = bit ? (bit.ruleId || '') : '';
  $('b_price').value = bit ? (bit.price || '') : '';
  $('b_sound').value = bit ? (bit.sound || '') : '';
  $('b_code').textContent = bit && bit.code ? ('code: ' + bit.code) : window.t('codeOnSave');
  if ($('b_kind')._syncLabel) $('b_kind')._syncLabel();
  if ($('b_rule')._syncLabel) $('b_rule')._syncLabel();
  toggleKind();
  $('editor').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function toggleKind() {
  const k = $('b_kind').value;
  $('row_media').style.display = k === 'alert' ? 'none' : '';
  $('row_sound').style.display = k === 'image' ? '' : 'none';
  $('row_alert').style.display = k === 'alert' ? '' : 'none';
  renderPreview();
}
$('b_kind').addEventListener('change', toggleKind);
$('b_up').onclick = () => $('file').click();
$('file').onchange = async e => { const f = e.target.files && e.target.files[0]; if (!f) return; const safe = f.name.replace(/[^A-Za-z0-9._-]/g, '_');
  try { const r = await fetch('/api/upload?name=' + encodeURIComponent(safe), { method: 'POST', body: f }); const d = await r.json();
    if (d.ok) { $('b_url').value = d.url; } else { status('upload failed', true); } } catch { status('upload failed', true); } };
$('b_imgup').onclick = () => $('imgfile').click();
$('imgfile').onchange = async e => { const f = e.target.files && e.target.files[0]; if (!f) return; const safe = f.name.replace(/[^A-Za-z0-9._-]/g, '_');
  try { const r = await fetch('/api/upload?name=' + encodeURIComponent(safe), { method: 'POST', body: f }); const d = await r.json();
    if (d.ok) { $('b_img').value = d.url; render(); } else { status('upload failed', true); } } catch { status('upload failed', true); } };
$('b_soundup').onclick = () => $('soundfile').click();
$('soundfile').onchange = async e => { const f = e.target.files && e.target.files[0]; if (!f) return; const safe = f.name.replace(/[^A-Za-z0-9._-]/g, '_');
  try { const r = await fetch('/api/upload?name=' + encodeURIComponent(safe), { method: 'POST', body: f }); const d = await r.json();
    if (d.ok) { $('b_sound').value = d.url; renderPreview(); } else { status('upload failed', true); } } catch { status('upload failed', true); } };
let pvEl = null, pvAud = null;
function pvBtn(s) { const b = $('pvBtn'); if (b) b.textContent = s === 'paused' ? '▶' : '⏸'; }
function pvFmt(t) { if (!isFinite(t) || t < 0) t = 0; const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); }
function pvTime(cur, dur) { const el = $('pvTime'); if (el) el.textContent = pvFmt(cur) + ' / ' + pvFmt(dur); }
function pvTrack(el) {
  const sync = () => pvTime(el.currentTime, el.duration);
  el.addEventListener('loadedmetadata', () => pvTime(0, el.duration));
  el.addEventListener('timeupdate', sync);
  el.addEventListener('ended', () => { pvBtn('paused'); pvTime(el.duration, el.duration); });
}
function pvStop() { try { if (pvEl) pvEl.pause(); } catch {} try { if (pvAud) pvAud.pause(); } catch {} pvEl = null; pvAud = null; pvBtn('paused'); pvTime(0, 0); }
function pvMountVid(el, src, vol) { el.src = src; el.muted = false; el.volume = vol; el.loop = false; el.playsInline = true; el.preload = 'auto'; pvTrack(el); pvEl = el; pvBtn('paused'); }
function pvMountAud(src, vol) { if (!src) return; const a = new Audio(src); a.preload = 'auto'; a.loop = false; a.volume = vol; pvTrack(a); pvAud = a; pvBtn('paused'); }
function pvToggle() { const m = pvEl || pvAud; if (!m) return;
  if (m.paused) { m.play().catch(() => {}); pvBtn('playing'); } else { m.pause(); pvBtn('paused'); } }
if ($('pvBtn')) $('pvBtn').onclick = pvToggle;
function renderPreview() {
  const k = $('b_kind').value, box = $('b_preview'); if (!box) return;
  pvStop(); box.innerHTML = '';
  const vol = Number($('b_vol') && $('b_vol').value) || 0.5;
  const ph = t => { const p = document.createElement('div'); p.className = 'ph'; p.textContent = t; return p; };
  if (k === 'alert') {
    const r = RULES.find(x => x.id === $('b_rule').value); const u = r && r.style && (r.style.video_url || r.style.image_url);
    if (u) {
      if (isVidUrl(u)) { const el = document.createElement('video'); pvMountVid(el, u, vol); box.append(el); }
      else { const el = document.createElement('img'); el.src = u; box.append(el); }
    }
    else box.append(ph(window.t('alert') + ': ' + ($('b_rule').value || '—')));
    return;
  }
  if (k === 'sound') {
    const u = $('b_url').value.trim();
    if (isVidUrl(u)) { const el = document.createElement('video'); pvMountVid(el, u, vol); box.append(el); return; }
    box.append(ph('🔊 ' + (u || '—'))); pvMountAud(u, vol); return;
  }
  const url = $('b_url').value.trim();
  if (!url) { box.append(ph('—')); return; }
  if (isVidUrl(url)) { const el = document.createElement('video'); pvMountVid(el, url, vol); box.append(el); }
  else { const img = document.createElement('img'); img.src = url; box.append(img); }
  if (k === 'image') pvMountAud($('b_sound').value.trim(), vol);
}
['b_url', 'b_sound', 'b_rule', 'b_kind'].forEach(id => { const el = $(id); if (el) { el.addEventListener('input', renderPreview); el.addEventListener('change', renderPreview); } });
if ($('b_vol')) { $('b_vol').title = window.t('vol'); $('b_vol').addEventListener('input', () => { const v = Number($('b_vol').value); if (pvEl) pvEl.volume = v; if (pvAud) pvAud.volume = v; }); }
function testBit(bit) { fetch('/api/test', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount: bit.price, name: 'Test User', message: 'Test bit', bit }) }); }
$('b_test').onclick = () => {
  if (selSlot < 0) return;
  const kind = $('b_kind').value;
  const bit = { slot: selSlot, label: $('b_label').value.trim(), kind, img: $('b_img').value.trim(), url: kind === 'alert' ? '' : $('b_url').value.trim(), sound: kind === 'image' ? $('b_sound').value.trim() : '', ruleId: kind === 'alert' ? $('b_rule').value : '', price: Number($('b_price').value) || 0, code: '' };
  const prev = BITS.find(x => Number(x.slot) === selSlot); if (prev && prev.code) bit.code = prev.code;
  testBit(bit);
};
function status(msg, err) { $('status').className = 'status' + (err ? ' err' : ' ok'); $('status').textContent = msg; }

$('b_apply').onclick = () => {
  if (selSlot < 0) return;
  const kind = $('b_kind').value;
  const bit = { slot: selSlot, label: $('b_label').value.trim(), kind, img: $('b_img').value.trim(), url: kind === 'alert' ? '' : $('b_url').value.trim(), sound: kind === 'image' ? $('b_sound').value.trim() : '', ruleId: kind === 'alert' ? $('b_rule').value : '', price: Number($('b_price').value) || 0, code: '' };
  const prev = BITS.find(x => Number(x.slot) === selSlot); if (prev && prev.code) bit.code = prev.code;
  BITS = BITS.filter(x => Number(x.slot) !== selSlot); BITS.push(bit);
  render(); status(window.t('applied'));
};
$('b_del').onclick = () => { if (selSlot < 0) return; BITS = BITS.filter(x => Number(x.slot) !== selSlot); $('editor').style.display = 'none'; selSlot = -1; render(); status(window.t('removed')); };
window.savePage = async () => {
  try {     const r = await fetch('/api/bits', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bits: BITS, grid: GRID, modes: MODES_ON }) });
    const d = await r.json(); if (d.ok) { BITS = d.bits || BITS; render(); status(window.t('saved')); } else status(window.t('saveError'), true);
  } catch { status(window.t('saveError'), true); }
};
async function load() {
  try { const b = await (await fetch('/api/bits')).json(); BITS = b.bits || []; GRID = b.grid || 5; MODES_ON = Array.isArray(b.modes) ? b.modes.filter(m => ['single','order','adhd'].includes(m)) : (['single','order','adhd'].includes(b.mode) ? [b.mode] : ['single']); } catch {}
  try { const n = await (await fetch('/api/notify')).json(); RULES = (n.rules || []); } catch {}
  $('b_rule').innerHTML = '';
  RULES.forEach(r => { const o = document.createElement('option'); o.value = r.id; o.textContent = (r.id === 'default' ? 'Default' : (r.label || r.id)); $('b_rule').append(o); });
  window.applyI18n(); enhanceSelects(); buildGridButtons(); syncModes();
  render();
}
load();
mountBgButtons($('bgbtns'), { pageWhich: 'bitspage', deckWhich: 'bits', withDefault: true });
</script>
</body>
</html>
