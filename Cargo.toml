[package]
name = "localmonodonate"
version = "0.2.5"
edition = "2021"
build = "build.rs"

[[bin]]
name = "LocalMonoDonate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
rand = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "url", "rustls-tls-webpki-roots"] }
tao = "0.30"
wry = "0.47"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Media_Multimedia"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
